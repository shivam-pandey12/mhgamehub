<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CID Pakad - Inspector Panic</title>
  <style>
    :root {
      color-scheme: light;
      --sky-top: #9dd8ff;
      --sky-bottom: #f7fbff;
      --ground-top: #5f6d55;
      --ground-body: #2e372b;
      --ground-detail: #dde7b8;
      --runner-main: #202635;
      --runner-back: rgba(32, 38, 53, 0.45);
      --shadow: rgba(18, 24, 32, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9e4ff;
    }

    body {
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .hud {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 3;
      padding: 12px 16px;
      min-width: 128px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(23, 28, 38, 0.78), rgba(23, 28, 38, 0.58));
      box-shadow: 0 18px 36px rgba(10, 13, 20, 0.22);
      color: #f5f7fb;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 220ms ease, transform 220ms ease;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .hud.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hud-label {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(235, 241, 255, 0.7);
    }

    .hud-score {
      margin: 4px 0 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .mode-panel {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .mode-toggle {
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 999px;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(18, 24, 34, 0.86), rgba(18, 24, 34, 0.68));
      color: #f5f7fb;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      box-shadow: 0 14px 28px rgba(9, 12, 18, 0.18);
    }

    .mode-toggle:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(9, 12, 18, 0.24);
    }

    .mode-toggle.is-chaos {
      background: linear-gradient(180deg, rgba(126, 30, 30, 0.92), rgba(74, 12, 12, 0.78));
      box-shadow: 0 18px 34px rgba(126, 30, 30, 0.28);
    }

    .mode-status {
      margin: 0;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(22, 28, 38, 0.62);
      color: rgba(244, 247, 255, 0.84);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .message-toast {
      position: fixed;
      top: 90px;
      left: 50%;
      z-index: 3;
      max-width: min(72vw, 420px);
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(23, 28, 38, 0.9), rgba(23, 28, 38, 0.72));
      box-shadow: 0 16px 34px rgba(9, 12, 18, 0.2);
      color: #f6f8ff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-align: center;
      transform: translate(-50%, -10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
      backdrop-filter: blur(10px);
    }

    .message-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .message-toast[data-tone="event"] {
      background: linear-gradient(180deg, rgba(82, 52, 18, 0.95), rgba(82, 52, 18, 0.74));
    }

    .message-toast[data-tone="danger"] {
      background: linear-gradient(180deg, rgba(108, 24, 24, 0.96), rgba(86, 18, 18, 0.76));
    }

    .action-panel {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 3;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .action-panel.is-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .action-button {
      min-width: 122px;
      padding: 14px 22px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(18, 24, 34, 0.9), rgba(18, 24, 34, 0.72));
      box-shadow: 0 18px 34px rgba(10, 12, 20, 0.2);
      color: #f5f7fb;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .action-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 36px rgba(10, 12, 20, 0.26);
    }

    .action-button.is-active {
      background: linear-gradient(180deg, rgba(180, 86, 44, 0.96), rgba(128, 52, 24, 0.78));
      box-shadow: 0 22px 40px rgba(136, 62, 30, 0.34);
      transform: translateY(1px) scale(0.98);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 320ms ease;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 42%),
        linear-gradient(180deg, rgba(10, 14, 22, 0.16), rgba(10, 14, 22, 0.52));
    }

    .overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-panel {
      width: min(92vw, 560px);
      padding: 28px 26px 24px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      background:
        linear-gradient(160deg, rgba(18, 26, 36, 0.86), rgba(33, 20, 29, 0.7)),
        rgba(18, 26, 36, 0.84);
      box-shadow: 0 28px 56px rgba(6, 10, 18, 0.34);
      color: #f4f7ff;
      text-align: center;
      transform: translateY(16px) scale(0.985);
      transition: transform 320ms ease, box-shadow 320ms ease;
      backdrop-filter: blur(10px);
    }

    .overlay.is-visible .overlay-panel {
      transform: translateY(0) scale(1);
    }

    .overlay[data-mode="start"] .overlay-panel {
      box-shadow: 0 26px 52px rgba(8, 12, 18, 0.28);
    }

    .overlay-kicker {
      margin: 0 0 10px;
      color: #ffcf75;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .overlay-title {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.1rem);
      line-height: 0.95;
      letter-spacing: 0.03em;
    }

    .overlay-subtitle {
      margin: 14px 0 0;
      color: rgba(245, 247, 255, 0.86);
      font-size: 1.04rem;
      line-height: 1.45;
    }

    .overlay-score {
      margin: 16px 0 0;
      font-size: 1.42rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #ffffff;
    }

    .overlay-score.is-hidden {
      display: none;
    }

    .overlay-message {
      margin: 14px 0 0;
      color: rgba(233, 238, 248, 0.78);
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .overlay-button {
      margin-top: 22px;
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      background: linear-gradient(180deg, #f6d17d, #e7a948);
      color: #1f1f18;
      font: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(231, 169, 72, 0.24);
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }

    .overlay-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 20px 34px rgba(231, 169, 72, 0.3);
    }

    .overlay-button:disabled {
      opacity: 0.56;
      cursor: default;
      box-shadow: none;
    }

    @media (max-width: 680px) {
      .hud {
        top: 12px;
        left: 12px;
        padding: 10px 12px;
      }

      .hud-score {
        font-size: 1.6rem;
      }

      .mode-panel {
        top: 12px;
        right: 12px;
      }

      .message-toast {
        top: 76px;
        max-width: 88vw;
        font-size: 0.88rem;
      }

      .action-panel {
        right: 12px;
        bottom: 12px;
      }

      .action-button {
        min-width: 112px;
        padding: 13px 18px;
      }

      .overlay {
        padding: 16px;
      }

      .overlay-panel {
        padding: 24px 18px 20px;
      }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" aria-label="CID Pakad endless runner"></canvas>
  <div id="hud" class="hud" aria-live="off">
    <p class="hud-label">Time Survived</p>
    <p id="scoreValue" class="hud-score">0.0s</p>
  </div>
  <div class="mode-panel">
    <button id="modeToggleButton" class="mode-toggle" type="button">Chaos Mode: Off</button>
    <p id="modeStatus" class="mode-status">Balanced pursuit</p>
  </div>
  <div id="messageToast" class="message-toast" data-tone="normal" aria-live="polite"></div>
  <div id="actionPanel" class="action-panel" aria-live="off">
    <button id="duckButton" class="action-button" type="button">Duck</button>
  </div>
  <div id="overlay" class="overlay is-visible" data-mode="start">
    <div class="overlay-panel">
      <p id="overlayKicker" class="overlay-kicker">CID Pakad</p>
      <h1 id="overlayTitle" class="overlay-title">Inspector Panic</h1>
      <p id="overlaySubtitle" class="overlay-subtitle">Press Space / Click to Start</p>
      <p id="overlayScore" class="overlay-score is-hidden"></p>
      <p id="overlayMessage" class="overlay-message">Run hard, panic harder, restart instantly.</p>
      <button id="overlayButton" class="overlay-button" type="button">Start Run</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const hud = document.getElementById("hud");
    const scoreValue = document.getElementById("scoreValue");
    const modeToggleButton = document.getElementById("modeToggleButton");
    const modeStatus = document.getElementById("modeStatus");
    const messageToast = document.getElementById("messageToast");
    const actionPanel = document.getElementById("actionPanel");
    const duckButton = document.getElementById("duckButton");
    const overlay = document.getElementById("overlay");
    const overlayKicker = document.getElementById("overlayKicker");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlaySubtitle = document.getElementById("overlaySubtitle");
    const overlayScore = document.getElementById("overlayScore");
    const overlayMessage = document.getElementById("overlayMessage");
    const overlayButton = document.getElementById("overlayButton");
    const launchParams = new URLSearchParams(window.location.search);
    const gameAudioMuted = launchParams.get("gamehubMuted") === "1";
    const audioDefaults = {
      runTrack: 0.74,
      catchTrack: 0.88
    };

    const audioController = {
      runTrack: new Audio("pakad.mp4"),
      catchTrack: new Audio("le.mp4")
    };

    audioController.runTrack.loop = true;
    audioController.runTrack.preload = "auto";
    audioController.runTrack.volume = audioDefaults.runTrack;
    audioController.catchTrack.preload = "auto";
    audioController.catchTrack.volume = audioDefaults.catchTrack;
    audioController.runTrack.muted = gameAudioMuted;
    audioController.catchTrack.muted = gameAudioMuted;
    if (gameAudioMuted) {
      audioController.runTrack.volume = 0;
      audioController.catchTrack.volume = 0;
    }

    function startRunLoopAudio() {
      if (!audioController.runTrack.paused) {
        return;
      }

      audioController.catchTrack.pause();
      const playPromise = audioController.runTrack.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => {});
      }
    }

    function stopRunLoopAudio(resetTime = false) {
      audioController.runTrack.pause();
      if (resetTime) {
        audioController.runTrack.currentTime = 0;
      }
    }

    function stopCatchAudio(resetTime = false) {
      audioController.catchTrack.pause();
      if (resetTime) {
        audioController.catchTrack.currentTime = 0;
      }
    }

    function playRunSound() {
      startRunLoopAudio();
    }
    function playJumpSound() {}
    function playChaseVoices() {}
    function playCatchSound() {
      stopRunLoopAudio(true);
      audioController.catchTrack.currentTime = 0;
      const playPromise = audioController.catchTrack.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => {});
      }
    }
    function playHitSound() {}
    function playObstacleSpawnSound() {}
    function playGameOverDialogue() {}
    function playUISound() {}
    function playChaosEventSound() {}
    function playNearCatchSound() {}

    const viewport = {
      width: window.innerWidth,
      height: window.innerHeight,
      dpr: Math.min(window.devicePixelRatio || 1, 2)
    };

    const palette = {};

    const input = {
      left: false,
      right: false,
      duck: false,
      jumpHeld: false,
      jumpPressed: false
    };

    const KEY_ACTIONS = {
      ArrowLeft: "left",
      KeyA: "left",
      ArrowRight: "right",
      KeyD: "right",
      ArrowUp: "jump",
      ArrowDown: "duck",
      Space: "jump",
      KeyW: "jump",
      KeyS: "duck"
    };

    const GAME_STATES = {
      START: "start",
      PLAYING: "playing",
      GAMEOVER: "gameover"
    };

    const GAME_OVER_MESSAGES = [
      "Case Closed",
      "Better luck next time",
      "You almost escaped..."
    ];

    const GAMEPLAY_MESSAGES = [
      "Run faster :(",
      "They are catching up!",
      "Don't look back",
      "This paperwork feels personal",
      "Keep moving. No dramatic pauses."
    ];

    const NEAR_CATCH_MESSAGES = [
      "THIS IS IT",
      "MOVE YOUR LEGS",
      "NOPE NOPE NOPE"
    ];

    const CHAOS_EVENT_TYPES = {
      SPEED_BOOST: "speed_boost",
      OBSTACLE_BURST: "obstacle_burst",
      ENEMY_RAGE: "enemy_rage"
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    function approach(current, target, maxDelta) {
      if (current < target) {
        return Math.min(current + maxDelta, target);
      }
      return Math.max(current - maxDelta, target);
    }

    function rectsOverlap(rectA, rectB) {
      return (
        rectA.x < rectB.x + rectB.width &&
        rectA.x + rectA.width > rectB.x &&
        rectA.y < rectB.y + rectB.height &&
        rectA.y + rectA.height > rectB.y
      );
    }

    function formatScore(seconds) {
      return `${seconds.toFixed(1)}s`;
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function resetInputState() {
      input.left = false;
      input.right = false;
      input.duck = false;
      input.jumpHeld = false;
      input.jumpPressed = false;
      duckButton.classList.remove("is-active");
    }

    const game = {
      gravity: 2100,
      baseRunSpeedStart: 320,
      baseRunSpeed: 320,
      targetBaseRunSpeed: 320,
      groundY: viewport.height * 0.82,
      cameraX: 0,
      cameraLookAhead: 0,
      view: {
        zoom: 1,
        rotation: 0
      },
      shakeOffset: {
        x: 0,
        y: 0
      },
      player: null,
      enemies: [],
      obstacles: [],
      projectiles: [],
      state: GAME_STATES.START,
      elapsedTime: 0,
      timeSurvived: 0,
      lastTime: 0,
      closestEnemyDistance: Infinity,
      chasePressure: 0,
      desiredClosestDistance: 168,
      chaseVoiceCooldown: 0,
      feedbackIntensity: 0,
      obstacleSpawnTimer: 0,
      lastObstacleSpawnX: 0,
      baseObstacleSpeed: 36,
      obstacleSpeed: 36,
      enemyAggression: 0,
      targetEnemyAggression: 0,
      impactShake: 0,
      impactFlash: 0,
      finalScore: 0,
      gameOverMessage: "",
      gameOverReason: "caught",
      catchSequenceTimer: 0,
      catchSequenceDuration: 1.2,
      overlayVisible: true,
      restartReady: false,
      chaosMode: false,
      chaosIntensity: 0,
      nearCatchIntensity: 0,
      nearCatchPulse: 0,
      nearCatchPulseValue: 0,
      nearCatchSoundCooldown: 0,
      messageText: "",
      messageTone: "normal",
      messageTimer: 0,
      messageDuration: 0
    };

    const eventSystem = {
      activeEvent: null,
      nextEventTimer: 0,
      burstRemaining: 0,
      burstSpawnTimer: 0,
      gameplayMessageCooldown: 0,
      nearCatchMessageCooldown: 0,

      reset() {
        this.activeEvent = null;
        this.burstRemaining = 0;
        this.burstSpawnTimer = 0;
        this.gameplayMessageCooldown = randomRange(game.chaosMode ? 4.8 : 7.2, game.chaosMode ? 8.2 : 11.4);
        this.nearCatchMessageCooldown = 0;
        this.scheduleNextEvent();
      },

      scheduleNextEvent() {
        this.nextEventTimer = randomRange(game.chaosMode ? 5.1 : 7.8, game.chaosMode ? 8.6 : 12.8);
      },

      getModifiers() {
        const modifiers = {
          playerSpeed: game.chaosMode ? 1.08 : 1,
          obstacleSpeed: game.chaosMode ? 1.14 : 1,
          enemyAggression: game.chaosMode ? 1.2 : 1,
          projectileRate: game.chaosMode ? 1.18 : 1,
          projectileSpeed: game.chaosMode ? 1.12 : 1,
          obstacleInterval: game.chaosMode ? 0.8 : 1,
          shakeBoost: game.chaosMode ? 1.24 : 1,
          visualChaos: game.chaosMode ? 0.52 : 0.18
        };

        if (!this.activeEvent) {
          return modifiers;
        }

        if (this.activeEvent.type === CHAOS_EVENT_TYPES.SPEED_BOOST) {
          modifiers.playerSpeed *= 1.18;
          modifiers.obstacleSpeed *= 1.12;
          modifiers.enemyAggression *= 1.08;
          modifiers.projectileSpeed *= 1.08;
          modifiers.shakeBoost *= 1.08;
          modifiers.visualChaos += 0.1;
        } else if (this.activeEvent.type === CHAOS_EVENT_TYPES.OBSTACLE_BURST) {
          modifiers.obstacleInterval *= 0.44;
          modifiers.obstacleSpeed *= 1.06;
          modifiers.shakeBoost *= 1.06;
          modifiers.visualChaos += 0.14;
        } else if (this.activeEvent.type === CHAOS_EVENT_TYPES.ENEMY_RAGE) {
          modifiers.enemyAggression *= 1.5;
          modifiers.projectileRate *= 1.34;
          modifiers.projectileSpeed *= 1.12;
          modifiers.playerSpeed *= 1.02;
          modifiers.shakeBoost *= 1.12;
          modifiers.visualChaos += 0.12;
        }

        return modifiers;
      },

      update(dt) {
        if (this.activeEvent) {
          this.activeEvent.timer = Math.max(0, this.activeEvent.timer - dt);
          if (this.activeEvent.timer <= 0) {
            this.activeEvent = null;
            this.scheduleNextEvent();
          }
        } else {
          this.nextEventTimer -= dt;
          if (this.nextEventTimer <= 0) {
            this.triggerRandomEvent();
          }
        }

        this.updateObstacleBurst(dt);
        this.updateGameplayMessages(dt);
      },

      updateObstacleBurst(dt) {
        if (this.burstRemaining <= 0) {
          return;
        }

        this.burstSpawnTimer -= dt;
        while (this.burstRemaining > 0 && this.burstSpawnTimer <= 0) {
          spawnObstacle({
            spacingScale: game.chaosMode ? 0.34 : 0.42,
            offsetMin: 44,
            offsetMax: game.chaosMode ? 94 : 118
          });
          this.burstRemaining -= 1;
          this.burstSpawnTimer += randomRange(game.chaosMode ? 0.16 : 0.2, game.chaosMode ? 0.3 : 0.36);
        }
      },

      triggerRandomEvent() {
        const roll = Math.random();
        const type = game.chaosMode
          ? (roll < 0.34 ? CHAOS_EVENT_TYPES.SPEED_BOOST : roll < 0.68 ? CHAOS_EVENT_TYPES.OBSTACLE_BURST : CHAOS_EVENT_TYPES.ENEMY_RAGE)
          : (roll < 0.4 ? CHAOS_EVENT_TYPES.SPEED_BOOST : roll < 0.68 ? CHAOS_EVENT_TYPES.OBSTACLE_BURST : CHAOS_EVENT_TYPES.ENEMY_RAGE);

        this.activate(type);
      },

      activate(type) {
        const labels = {
          [CHAOS_EVENT_TYPES.SPEED_BOOST]: "Speed Boost",
          [CHAOS_EVENT_TYPES.OBSTACLE_BURST]: "Obstacle Burst",
          [CHAOS_EVENT_TYPES.ENEMY_RAGE]: "Enemy Rage"
        };

        const durations = {
          [CHAOS_EVENT_TYPES.SPEED_BOOST]: [3.2, 4.8],
          [CHAOS_EVENT_TYPES.OBSTACLE_BURST]: [2.8, 4.1],
          [CHAOS_EVENT_TYPES.ENEMY_RAGE]: [3.4, 4.8]
        };

        const durationRange = durations[type];
        this.activeEvent = {
          type,
          label: labels[type],
          timer: randomRange(durationRange[0], durationRange[1])
        };

        if (type === CHAOS_EVENT_TYPES.OBSTACLE_BURST) {
          this.burstRemaining = Math.floor(randomRange(game.chaosMode ? 6 : 4, game.chaosMode ? 10 : 7));
          this.burstSpawnTimer = 0.04;
        }

        showGameplayMessage(labels[type], type === CHAOS_EVENT_TYPES.ENEMY_RAGE ? "danger" : "event", 1.5);
        playChaosEventSound();
      },

      updateGameplayMessages(dt) {
        this.gameplayMessageCooldown = Math.max(0, this.gameplayMessageCooldown - dt);
        this.nearCatchMessageCooldown = Math.max(0, this.nearCatchMessageCooldown - dt);

        if (this.gameplayMessageCooldown > 0 || game.state !== GAME_STATES.PLAYING) {
          return;
        }

        if (Math.random() < (game.chaosMode ? 0.72 : 0.46)) {
          showGameplayMessage(randomItem(GAMEPLAY_MESSAGES), "normal", randomRange(1.35, 1.95));
        }

        this.gameplayMessageCooldown = randomRange(game.chaosMode ? 4.6 : 6.6, game.chaosMode ? 7.8 : 11.2);
      }
    };

    function resizeCanvas() {
      viewport.width = window.innerWidth;
      viewport.height = window.innerHeight;
      viewport.dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(viewport.width * viewport.dpr);
      canvas.height = Math.round(viewport.height * viewport.dpr);
      canvas.style.width = `${viewport.width}px`;
      canvas.style.height = `${viewport.height}px`;

      ctx.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      game.groundY = viewport.height * 0.82;

      if (game.player && game.player.onGround) {
        game.player.position.y = game.groundY - game.player.legLength;
      }

      for (const enemy of game.enemies) {
        if (enemy.onGround) {
          enemy.position.y = game.groundY - enemy.legLength;
        }
      }
    }

    function syncPalette() {
      const styles = getComputedStyle(document.documentElement);

      palette.skyTop = styles.getPropertyValue("--sky-top").trim();
      palette.skyBottom = styles.getPropertyValue("--sky-bottom").trim();
      palette.groundTop = styles.getPropertyValue("--ground-top").trim();
      palette.groundBody = styles.getPropertyValue("--ground-body").trim();
      palette.groundDetail = styles.getPropertyValue("--ground-detail").trim();
      palette.runnerMain = styles.getPropertyValue("--runner-main").trim();
      palette.runnerBack = styles.getPropertyValue("--runner-back").trim();
      palette.shadow = styles.getPropertyValue("--shadow").trim();
    }

    function syncAudioPlayback() {
      if (document.hidden || game.state !== GAME_STATES.PLAYING) {
        stopRunLoopAudio(false);
        return;
      }

      startRunLoopAudio();
    }

    class Player {
      constructor(x, groundY) {
        this.position = {
          x,
          y: groundY - 46
        };
        this.velocity = {
          y: 0
        };
        this.bodyTilt = 0.18;
        this.torsoLength = 34;
        this.headRadius = 11;
        this.legLength = 46;
        this.upperArmLength = 17;
        this.lowerArmLength = 15;
        this.upperLegLength = 23;
        this.lowerLegLength = 23;

        this.baseRunRate = 11.5;
        this.jumpSpeed = 760;
        this.maxHorizontalAdjust = 140;
        this.groundAdjustAcceleration = 900;
        this.airAdjustAcceleration = 520;
        this.coyoteTimeWindow = 0.09;
        this.jumpBufferWindow = 0.12;

        this.horizontalAdjust = 0;
        this.onGround = true;
        this.runCycle = 0;
        this.coyoteTimer = this.coyoteTimeWindow;
        this.jumpBufferTimer = 0;
        this.stepIndex = 0;
        this.hitCooldown = 0;
        this.stumbleTimer = 0;
        this.stumbleDuration = 0.46;
        this.slowdownTimer = 0;
        this.slowdownDuration = 0.72;
        this.slowdownStrength = 0;
        this.currentSlowdown = 0;
        this.knockbackVelocity = 0;
        this.turnLean = 0;
        this.renderBodyTilt = this.bodyTilt;
        this.renderStrideOffset = 0;
        this.renderStrideMultiplier = 1;
        this.renderBobOffset = 0;
        this.renderHeadBob = 0;
        this.crouchProgress = 0;
      }

      update(dt, gameState, controls) {
        this.updateImpactState(dt);

        const moveAxis = Number(controls.right) - Number(controls.left);
        const targetAdjust = moveAxis * this.maxHorizontalAdjust;
        const acceleration = this.onGround
          ? this.groundAdjustAcceleration
          : this.airAdjustAcceleration;

        this.horizontalAdjust = approach(
          this.horizontalAdjust,
          targetAdjust,
          acceleration * dt
        );

        if (controls.jumpPressed) {
          this.jumpBufferTimer = this.jumpBufferWindow;
        } else {
          this.jumpBufferTimer = Math.max(0, this.jumpBufferTimer - dt);
        }

        if (this.onGround) {
          this.coyoteTimer = this.coyoteTimeWindow;
        } else {
          this.coyoteTimer = Math.max(0, this.coyoteTimer - dt);
        }

        if (this.jumpBufferTimer > 0 && this.coyoteTimer > 0) {
          this.velocity.y = -this.jumpSpeed;
          this.onGround = false;
          this.coyoteTimer = 0;
          this.jumpBufferTimer = 0;
          playJumpSound();
        }

        this.velocity.y += gameState.gravity * dt;
        this.position.y += this.velocity.y * dt;

        const forwardVelocity = Math.max(
          -110,
          gameState.baseRunSpeed * (1 - this.currentSlowdown) + this.knockbackVelocity
        );
        this.position.x += (forwardVelocity + this.horizontalAdjust) * dt;

        const groundLockedY = gameState.groundY - this.legLength;
        if (this.position.y >= groundLockedY) {
          this.position.y = groundLockedY;
          this.velocity.y = 0;
          this.onGround = true;
        } else {
          this.onGround = false;
        }

        const wantsDuck = controls.duck && this.onGround && !controls.jumpHeld;
        const crouchSpeed = wantsDuck ? 7.5 : 9.5;
        this.crouchProgress = approach(this.crouchProgress, wantsDuck ? 1 : 0, crouchSpeed * dt);

        const runRate = this.baseRunRate +
          Math.abs(this.horizontalAdjust) * 0.012 +
          Math.max(0, forwardVelocity) * 0.004 +
          this.currentSlowdown * 2.8;
        if (this.onGround) {
          this.runCycle += runRate * dt;
          const nextStepIndex = Math.floor(this.runCycle / Math.PI);
          if (nextStepIndex !== this.stepIndex) {
            this.stepIndex = nextStepIndex;
            playRunSound();
          }
        }

        this.updateAnimationState(dt, gameState, moveAxis, forwardVelocity);
      }

      updateImpactState(dt) {
        this.hitCooldown = Math.max(0, this.hitCooldown - dt);
        this.slowdownTimer = Math.max(0, this.slowdownTimer - dt);
        this.stumbleTimer = Math.max(0, this.stumbleTimer - dt);
        this.knockbackVelocity = approach(this.knockbackVelocity, 0, 520 * dt);

        const slowdownRatio = clamp(this.slowdownTimer / this.slowdownDuration, 0, 1);
        this.currentSlowdown = this.slowdownStrength * slowdownRatio;
      }

      updateAnimationState(dt, gameState, moveAxis, forwardVelocity) {
        const stumbleRatio = clamp(this.stumbleTimer / this.stumbleDuration, 0, 1);
        const stumblePulse = Math.sin(gameState.elapsedTime * 32 + 0.9);
        const crouch = this.crouchProgress;
        const directionTarget = clamp(this.horizontalAdjust / this.maxHorizontalAdjust, -1, 1) * 0.11;
        const speedBoost = clamp((forwardVelocity - gameState.baseRunSpeedStart) / 250, -0.08, 0.28);

        this.turnLean = approach(this.turnLean, directionTarget, 2.8 * dt);
        this.renderBodyTilt = this.bodyTilt +
          this.turnLean +
          crouch * 0.24 -
          stumbleRatio * 0.28 +
          stumblePulse * 0.08 * stumbleRatio;
        this.renderStrideOffset = stumblePulse * 0.58 * stumbleRatio + this.turnLean * 0.24;
        this.renderStrideMultiplier = (1.12 + speedBoost + Math.abs(moveAxis) * 0.08 - crouch * 0.22) *
          (1 + Math.sin(gameState.elapsedTime * 26 + 1.7) * 0.22 * stumbleRatio);
        this.renderBobOffset = Math.abs(Math.sin(gameState.elapsedTime * 34 + 0.35)) * 5 * stumbleRatio + crouch * 2.2;
        this.renderHeadBob = Math.sin(this.runCycle * 2.32 + 0.25) * (1.1 + this.renderStrideMultiplier * 0.7) *
          (1 - crouch * 0.42);
      }

      applyStumble(intensity = 1) {
        const safeIntensity = clamp(intensity, 0.6, 1.6);
        this.hitCooldown = Math.max(this.hitCooldown, 0.28);
        this.stumbleTimer = Math.max(this.stumbleTimer, this.stumbleDuration);
        this.slowdownTimer = Math.max(this.slowdownTimer, this.slowdownDuration * safeIntensity);
        this.slowdownStrength = Math.max(this.slowdownStrength, 0.34 + safeIntensity * 0.18);
        this.currentSlowdown = Math.max(this.currentSlowdown, this.slowdownStrength);
        this.knockbackVelocity = Math.min(this.knockbackVelocity, -130 - safeIntensity * 90);
        this.renderBodyTilt = this.bodyTilt - 0.18;
        this.renderStrideOffset = 0.24;
        this.renderStrideMultiplier = 1.1;
      }

      canBeHit() {
        return this.hitCooldown <= 0;
      }

      getMistakePressure() {
        return this.currentSlowdown + (this.stumbleTimer > 0 ? 0.24 : 0);
      }

      getCollisionBounds() {
        const duckCover = this.crouchProgress * 12;
        return {
          x: this.position.x - 16,
          y: this.position.y - this.torsoLength - this.headRadius * 2 - 8 + duckCover,
          width: 32,
          height: this.legLength + this.torsoLength + this.headRadius * 2 + 10 - duckCover * 0.45
        };
      }

      getProjectileCollisionBounds() {
        const crouch = this.crouchProgress;
        return {
          x: this.position.x - 18,
          y: this.position.y - this.torsoLength - this.headRadius * 2 - 8 + crouch * 34,
          width: 36,
          height: this.legLength + this.torsoLength + this.headRadius * 2 + 10 - crouch * 32
        };
      }

      applyProjectileHit() {
        this.hitCooldown = Math.max(this.hitCooldown, 0.4);
        this.stumbleTimer = Math.max(this.stumbleTimer, this.stumbleDuration);
        this.slowdownTimer = Math.max(this.slowdownTimer, this.slowdownDuration);
        this.slowdownStrength = Math.max(this.slowdownStrength, 0.58);
        this.currentSlowdown = Math.max(this.currentSlowdown, this.slowdownStrength);
        this.knockbackVelocity = Math.min(this.knockbackVelocity, -220);
        this.crouchProgress = 0;
        this.renderBodyTilt = 1.02;
        this.renderStrideOffset = 0.48;
        this.renderStrideMultiplier = 0.4;
        this.renderBobOffset = 4.8;
        this.renderHeadBob = -0.8;
      }

      render(context, cameraX) {
        const screenX = this.position.x - cameraX;
        const aerialBlend = this.onGround ? 0 : 0.55;
        const crouch = this.crouchProgress;
        const strideChaos = this.renderStrideOffset;
        const strideScale = this.renderStrideMultiplier;
        const strideA = (Math.sin(this.runCycle) + strideChaos) * (1 - aerialBlend) * strideScale;
        const strideB = (Math.sin(this.runCycle + Math.PI) - strideChaos * 0.92) * (1 - aerialBlend) * strideScale;
        const bobLift = (this.onGround ? Math.abs(Math.sin(this.runCycle * 2.1)) * 3 : 0) + this.renderBobOffset;
        const bodyTilt = this.renderBodyTilt ?? this.bodyTilt;
        const torsoLength = this.torsoLength * (1 - crouch * 0.34);
        const hip = {
          x: screenX,
          y: this.position.y - bobLift + crouch * 7
        };
        const shoulder = {
          x: hip.x + Math.sin(bodyTilt) * torsoLength,
          y: hip.y - Math.cos(bodyTilt) * torsoLength
        };
        const head = {
          x: shoulder.x + Math.sin(bodyTilt) * (this.headRadius + 4 - crouch * 2),
          y: shoulder.y - Math.cos(bodyTilt) * (this.headRadius + 4 - crouch * 1.5) + this.renderHeadBob + crouch * 4
        };

        const backLeg = this.computeLeg(hip, strideB, true);
        const frontLeg = this.computeLeg(hip, strideA, false);
        const backArm = this.computeArm(shoulder, strideA, true);
        const frontArm = this.computeArm(shoulder, strideB, false);

        this.drawShadow(context, screenX);
        this.drawLimb(context, backLeg, palette.runnerBack, 4);
        this.drawLimb(context, backArm, palette.runnerBack, 4);

        context.strokeStyle = palette.runnerMain;
        context.lineWidth = 5;
        context.beginPath();
        context.moveTo(hip.x, hip.y);
        context.lineTo(shoulder.x, shoulder.y);
        context.stroke();

        context.fillStyle = "#f6fbff";
        context.beginPath();
        context.arc(head.x, head.y, this.headRadius, 0, Math.PI * 2);
        context.fill();

        context.strokeStyle = palette.runnerMain;
        context.lineWidth = 4;
        context.stroke();

        this.drawLimb(context, frontLeg, palette.runnerMain, 5);
        this.drawLimb(context, frontArm, palette.runnerMain, 5);
      }

      computeLeg(origin, stride, isBackLeg) {
        const jumpLift = this.onGround ? 0 : clamp(-this.velocity.y / 900, -0.25, 0.35);
        const crouchBend = this.crouchProgress * 0.56;
        const upperAngle = stride * 0.92 - jumpLift * 0.3 + crouchBend;
        const lowerAngle = upperAngle - Math.cos(this.runCycle + (isBackLeg ? Math.PI : 0)) * (0.42 + crouchBend * 0.26);

        const knee = {
          x: origin.x + Math.sin(upperAngle) * this.upperLegLength,
          y: origin.y + Math.cos(upperAngle) * this.upperLegLength
        };

        const foot = {
          x: knee.x + Math.sin(lowerAngle) * this.lowerLegLength,
          y: knee.y + Math.cos(lowerAngle) * this.lowerLegLength
        };

        return { origin, joint: knee, end: foot };
      }

      computeArm(origin, stride, isBackArm) {
        const crouchTuck = this.crouchProgress * 0.42;
        const upperAngle = -stride * 0.88 + (this.onGround ? 0 : 0.12) + (isBackArm ? -crouchTuck * 0.14 : crouchTuck * 0.26);
        const lowerAngle = upperAngle + Math.sin(this.runCycle + (isBackArm ? Math.PI : 0)) * 0.18 + crouchTuck * 0.18;

        const elbow = {
          x: origin.x + Math.sin(upperAngle) * this.upperArmLength,
          y: origin.y + Math.cos(upperAngle) * this.upperArmLength
        };

        const hand = {
          x: elbow.x + Math.sin(lowerAngle) * this.lowerArmLength,
          y: elbow.y + Math.cos(lowerAngle) * this.lowerArmLength
        };

        return { origin, joint: elbow, end: hand };
      }

      drawLimb(context, limb, color, width) {
        context.strokeStyle = color;
        context.lineWidth = width;
        context.beginPath();
        context.moveTo(limb.origin.x, limb.origin.y);
        context.lineTo(limb.joint.x, limb.joint.y);
        context.lineTo(limb.end.x, limb.end.y);
        context.stroke();
      }

      drawShadow(context, screenX) {
        const airHeight = Math.max(0, game.groundY - (this.position.y + this.legLength));
        const scale = clamp(1 - airHeight / 180, 0.55, 1);

        context.fillStyle = palette.shadow;
        context.beginPath();
        context.ellipse(
          screenX,
          game.groundY + 4,
          23 * scale,
          7 * scale,
          0,
          0,
          Math.PI * 2
        );
        context.fill();
      }
    }

    class Enemy {
      constructor(config) {
        this.position = {
          x: config.x,
          y: config.groundY - 44 * config.scale
        };
        this.velocity = {
          y: 0
        };
        this.scale = config.scale;
        this.colors = config.colors;
        this.baseGap = config.baseGap;
        this.speedOffset = config.speedOffset;
        this.baseBodyTilt = 0.12 + randomRange(-0.04, 0.05);
        this.torsoLength = 31 * this.scale;
        this.headRadius = 10 * this.scale;
        this.legLength = 44 * this.scale;
        this.upperArmLength = 15 * this.scale;
        this.lowerArmLength = 14 * this.scale;
        this.upperLegLength = 22 * this.scale;
        this.lowerLegLength = 22 * this.scale;
        this.baseRunRate = 10.3 + randomRange(-1.2, 1.4);
        this.maxCatchupSpeed = 180 + randomRange(30, 85);
        this.catchRadius = 24 * this.scale;
        this.runCycle = randomRange(0, Math.PI * 2);
        this.aggressionBias = randomRange(0.82, 1.24);
        this.strideScaleBias = randomRange(0.94, 1.2);
        this.runRateBias = randomRange(0.92, 1.08);
        this.messiness = randomRange(0.12, 0.28);
        this.onGround = true;
        this.wobblePhase = randomRange(0, Math.PI * 2);
        this.wobbleFrequency = randomRange(5.2, 8.6);
        this.wobbleAmount = randomRange(0.05, 0.14);
        this.formationYOffset = randomRange(-5, 4);
        this.wanderX = 0;
        this.wanderY = 0;
        this.wanderTargetX = randomRange(-10, 10);
        this.wanderTargetY = randomRange(-3, 3);
        this.wanderTimer = randomRange(0.18, 0.45);
        this.jumpReactionTimer = -1;
        this.jumpReactionDelay = randomRange(0.08, 0.24);
        this.lungeTimer = 0;
        this.lungeStrength = randomRange(30, 78);
        this.rodLength = 18 * this.scale;
        this.rodWidth = 5 * this.scale;
        this.hasRod = Boolean(config.hasRod);
        this.throwBias = randomRange(-0.12, 0.24);
        this.throwCooldown = this.hasRod ? randomRange(1.25, 2.4) : Infinity;
        this.throwWindup = 0;
      }

      update(dt, gameState, playerJustJumped) {
        if (playerJustJumped) {
          this.jumpReactionTimer = this.jumpReactionDelay + randomRange(0, 0.08);
        }

        this.wanderTimer -= dt;
        if (this.wanderTimer <= 0) {
          this.wanderTimer = randomRange(0.2, 0.5);
          this.wanderTargetX = randomRange(-16, 16);
          this.wanderTargetY = randomRange(-4, 4);
        }

        this.wanderX = approach(this.wanderX, this.wanderTargetX, 42 * dt);
        this.wanderY = approach(this.wanderY, this.wanderTargetY, 24 * dt);

        if (this.jumpReactionTimer >= 0) {
          this.jumpReactionTimer -= dt;
          if (this.jumpReactionTimer <= 0) {
            this.jumpReactionTimer = -1;
            this.lungeTimer = randomRange(0.16, 0.3);

            if (this.onGround && Math.random() > 0.38) {
              this.velocity.y = -randomRange(160, 245);
              this.onGround = false;
            }
          }
        }

        if (this.lungeTimer > 0) {
          this.lungeTimer = Math.max(0, this.lungeTimer - dt);
        }

        const aggressionBoost = gameState.enemyAggression * this.aggressionBias;
        const gapWobble = Math.sin(gameState.elapsedTime * 0.9 + this.wobblePhase) * 12;
        const desiredGap = gameState.desiredClosestDistance + this.baseGap + gapWobble - aggressionBoost * 0.45;
        const desiredX = gameState.player.position.x - desiredGap;
        const correction = clamp(
          (desiredX - this.position.x) * 2.5,
          -160,
          this.maxCatchupSpeed + aggressionBoost * 2.2
        );
        const lungeBoost = this.lungeTimer > 0 ? this.lungeStrength : 0;
        const speedJitter = Math.sin(gameState.elapsedTime * this.wobbleFrequency + this.wobblePhase) * 18;
        const forwardSpeed = Math.max(
          70,
          gameState.baseRunSpeed + this.speedOffset + correction + lungeBoost + speedJitter + aggressionBoost * 1.35
        );

        this.position.x += forwardSpeed * dt;

        this.velocity.y += gameState.gravity * 0.82 * dt;
        this.position.y += this.velocity.y * dt;

        const groundLockedY = gameState.groundY - this.legLength;
        if (this.position.y >= groundLockedY) {
          this.position.y = groundLockedY;
          this.velocity.y = 0;
          this.onGround = true;
        } else {
          this.onGround = false;
        }

        const runRate = (this.baseRunRate + forwardSpeed * 0.012) * this.runRateBias;
        this.runCycle += runRate * dt * (this.onGround ? 1 : 0.45);
        this.throwWindup = approach(this.throwWindup, 0, 3.2 * dt);

        return this.updateThrow(dt, gameState);
      }

      render(context, cameraX, elapsedTime) {
        const anchor = this.getVisualAnchor();
        const screenX = anchor.x - cameraX;
        const aerialBlend = this.onGround ? 0 : 0.48;
        const chaosMess = this.messiness + game.chaosIntensity * 0.12;
        const strideScale = this.strideScaleBias + Math.sin(elapsedTime * 3.4 + this.wobblePhase) * 0.07;
        const gaitOffset = Math.sin(elapsedTime * 8.2 + this.wobblePhase) * chaosMess;
        const strideA = (Math.sin(this.runCycle) + gaitOffset) * (1 - aerialBlend) * strideScale;
        const strideB = (Math.sin(this.runCycle + Math.PI) - gaitOffset * 0.92) * (1 - aerialBlend) * strideScale;
        const bobLift = this.onGround
          ? Math.abs(Math.sin(this.runCycle * 2 + this.wobblePhase)) * (2.6 + chaosMess * 2.4) * this.scale
          : 0;
        const bodyTilt = this.baseBodyTilt +
          Math.sin(elapsedTime * this.wobbleFrequency + this.wobblePhase) * (this.wobbleAmount + chaosMess * 0.08) +
          this.throwWindup * 0.08;
        const hip = {
          x: screenX,
          y: anchor.y - bobLift
        };
        const shoulder = {
          x: hip.x + Math.sin(bodyTilt) * this.torsoLength,
          y: hip.y - Math.cos(bodyTilt) * this.torsoLength
        };
        const head = {
          x: shoulder.x + Math.sin(bodyTilt) * (this.headRadius + 4),
          y: shoulder.y - Math.cos(bodyTilt) * (this.headRadius + 4)
        };

        const backLeg = this.computeLeg(hip, strideB, true);
        const frontLeg = this.computeLeg(hip, strideA, false);
        const backArm = this.computeArm(shoulder, strideA, true);
        const frontArm = this.computeArm(shoulder, strideB, false);

        this.drawShadow(context, screenX);
        this.drawLimb(context, backLeg, this.colors.back, 4 * this.scale);
        this.drawLimb(context, backArm, this.colors.back, 4 * this.scale);

        context.strokeStyle = this.colors.main;
        context.lineWidth = 4.8 * this.scale;
        context.beginPath();
        context.moveTo(hip.x, hip.y);
        context.lineTo(shoulder.x, shoulder.y);
        context.stroke();

        context.fillStyle = this.colors.head;
        context.beginPath();
        context.arc(head.x, head.y, this.headRadius, 0, Math.PI * 2);
        context.fill();

        context.strokeStyle = this.colors.main;
        context.lineWidth = 3.6 * this.scale;
        context.stroke();

        this.drawLimb(context, frontLeg, this.colors.main, 4.8 * this.scale);
        this.drawLimb(context, frontArm, this.colors.main, 4.8 * this.scale);
        if (this.hasRod) {
          this.drawRod(context, frontArm);
        }
      }

      computeLeg(origin, stride, isBackLeg) {
        const jumpLift = this.onGround ? 0 : clamp(-this.velocity.y / 760, -0.18, 0.22);
        const wobble = Math.sin(this.runCycle * 1.2 + this.wobblePhase + (isBackLeg ? Math.PI : 0)) *
          (0.08 + this.messiness * 0.16 + game.chaosIntensity * 0.06);
        const upperAngle = stride * 0.96 - jumpLift * 0.25 + wobble;
        const lowerAngle = upperAngle - Math.cos(this.runCycle + (isBackLeg ? Math.PI : 0)) * 0.4;

        const knee = {
          x: origin.x + Math.sin(upperAngle) * this.upperLegLength,
          y: origin.y + Math.cos(upperAngle) * this.upperLegLength
        };

        const foot = {
          x: knee.x + Math.sin(lowerAngle) * this.lowerLegLength,
          y: knee.y + Math.cos(lowerAngle) * this.lowerLegLength
        };

        return { origin, joint: knee, end: foot };
      }

      computeArm(origin, stride, isBackArm) {
        const wobble = Math.sin(this.runCycle * 1.6 + this.wobblePhase + (isBackArm ? Math.PI : 0)) *
          (0.07 + this.messiness * 0.12 + game.chaosIntensity * 0.05);
        const upperAngle = -stride * 0.9 + (this.onGround ? 0 : 0.1) + wobble;
        const lowerAngle = upperAngle + Math.sin(this.runCycle + (isBackArm ? Math.PI : 0)) * 0.2;

        const elbow = {
          x: origin.x + Math.sin(upperAngle) * this.upperArmLength,
          y: origin.y + Math.cos(upperAngle) * this.upperArmLength
        };

        const hand = {
          x: elbow.x + Math.sin(lowerAngle) * this.lowerArmLength,
          y: elbow.y + Math.cos(lowerAngle) * this.lowerArmLength
        };

        return { origin, joint: elbow, end: hand };
      }

      drawLimb(context, limb, color, width) {
        context.strokeStyle = color;
        context.lineWidth = width;
        context.beginPath();
        context.moveTo(limb.origin.x, limb.origin.y);
        context.lineTo(limb.joint.x, limb.joint.y);
        context.lineTo(limb.end.x, limb.end.y);
        context.stroke();
      }

      drawRod(context, arm) {
        const angle = Math.atan2(arm.end.y - arm.joint.y, arm.end.x - arm.joint.x);

        context.save();
        context.translate(arm.end.x, arm.end.y);
        context.rotate(angle + 0.28);
        context.fillStyle = this.colors.rod;
        context.fillRect(0, -this.rodWidth / 2, this.rodLength, this.rodWidth);
        context.restore();
      }

      drawShadow(context, screenX) {
        const airHeight = Math.max(0, game.groundY - (this.position.y + this.legLength));
        const scale = clamp(1 - airHeight / 120, 0.5, 1);

        context.fillStyle = palette.shadow;
        context.beginPath();
        context.ellipse(
          screenX,
          game.groundY + 4,
          18 * this.scale * scale,
          6 * this.scale * scale,
          0,
          0,
          Math.PI * 2
        );
        context.fill();
      }

      getVisualAnchor() {
        return {
          x: this.position.x + this.wanderX * 0.45,
          y: this.position.y + this.formationYOffset + this.wanderY * 0.45
        };
      }

      getCollisionAnchor() {
        return {
          x: this.position.x + this.wanderX * 0.25,
          y: this.position.y + this.formationYOffset
        };
      }

      updateThrow(dt, gameState) {
        if (!this.hasRod || gameState.state !== GAME_STATES.PLAYING) {
          return null;
        }

        const modifiers = eventSystem.getModifiers();
        const gapToPlayer = gameState.player.position.x - this.position.x;

        if (gapToPlayer < 120 || gapToPlayer > viewport.width * 0.72) {
          this.throwCooldown = Math.min(this.throwCooldown + dt * 0.2, 2.6);
          return null;
        }

        this.throwCooldown -= dt * (modifiers.projectileRate + this.aggressionBias * 0.08);
        if (this.throwCooldown > 0) {
          return null;
        }

        this.resetThrowCooldown(gameState);
        this.throwWindup = 1;

        return {
          lane: Math.random() < 0.54 ? "high" : "low",
          speedScale: modifiers.projectileSpeed * (0.96 + this.aggressionBias * 0.08)
        };
      }

      resetThrowCooldown(gameState) {
        const aggressionFactor = clamp(gameState.enemyAggression / 52, 0, 1);
        const minCooldown = gameState.chaosMode ? 0.9 : 1.35;
        const maxCooldown = gameState.chaosMode ? 1.72 : 2.35;
        this.throwCooldown = clamp(
          randomRange(minCooldown, maxCooldown) + this.throwBias - aggressionFactor * 0.32,
          0.64,
          2.7
        );
      }

      getThrowOrigin(elapsedTime, lane) {
        const anchor = this.getVisualAnchor();
        const chaosMess = this.messiness + game.chaosIntensity * 0.12;
        const bodyTilt = this.baseBodyTilt +
          Math.sin(elapsedTime * this.wobbleFrequency + this.wobblePhase) * (this.wobbleAmount + chaosMess * 0.08) +
          this.throwWindup * 0.08;
        const shoulder = {
          x: anchor.x + Math.sin(bodyTilt) * this.torsoLength,
          y: anchor.y - Math.cos(bodyTilt) * this.torsoLength
        };

        return {
          x: shoulder.x + (lane === "high" ? 18 : 14) * this.scale,
          y: shoulder.y + (lane === "high" ? 10 : 22) * this.scale
        };
      }
    }

    class ThrownRod {
      constructor(config) {
        this.position = {
          x: config.x,
          y: config.y
        };
        this.velocity = {
          x: config.velocityX,
          y: config.velocityY
        };
        this.length = config.length;
        this.width = config.width;
        this.rotation = config.rotation;
        this.angularVelocity = config.angularVelocity;
        this.color = config.color;
        this.tipColor = config.tipColor;
        this.lane = config.lane;
        this.hitPlayer = false;
      }

      update(dt, gameState) {
        this.position.x += this.velocity.x * dt;
        this.position.y += this.velocity.y * dt;
        this.velocity.y += gameState.gravity * 0.22 * dt;
        this.rotation += this.angularVelocity * dt;
      }

      render(context, cameraX) {
        const screenX = this.position.x - cameraX;

        context.save();
        context.translate(screenX, this.position.y);
        context.rotate(this.rotation);
        context.fillStyle = this.color;
        context.fillRect(-this.length / 2, -this.width / 2, this.length, this.width);
        context.fillStyle = this.tipColor;
        context.fillRect(this.length * 0.18, -this.width * 0.56, this.length * 0.26, this.width * 1.12);
        context.beginPath();
        context.arc(-this.length / 2, 0, this.width * 0.68, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      getBounds() {
        const boundWidth = Math.max(18, this.length * 0.92);
        const boundHeight = Math.max(14, this.width * 4.4);
        return {
          x: this.position.x - boundWidth / 2,
          y: this.position.y - boundHeight / 2,
          width: boundWidth,
          height: boundHeight
        };
      }

      isOffscreen(cameraX) {
        const screenX = this.position.x - cameraX;
        return (
          screenX < -260 ||
          screenX > viewport.width + 260 ||
          this.position.y > game.groundY + 180 ||
          this.position.y < -180
        );
      }

      registerHit() {
        this.hitPlayer = true;
      }
    }

    class Obstacle {
      constructor(config) {
        this.type = config.type;
        this.position = {
          x: config.x
        };
        this.width = config.width;
        this.height = config.height;
        this.speedOffset = config.speedOffset;
        this.colors = config.colors;
        this.rotation = config.rotation;
        this.clearanceHeight = config.clearanceHeight ?? 0;
        this.wobblePhase = randomRange(0, Math.PI * 2);
        this.hitPulse = 0;
        this.hitPlayer = false;
      }

      update(dt, gameState) {
        this.position.x -= (gameState.obstacleSpeed + this.speedOffset) * dt;
        this.hitPulse = Math.max(0, this.hitPulse - dt * 4.2);
      }

      render(context, cameraX, elapsedTime) {
        const screenX = this.position.x - cameraX;
        const wobble = Math.sin(elapsedTime * 5.4 + this.wobblePhase) * 0.01 + this.hitPulse * 0.06;

        context.save();
        context.translate(screenX, game.groundY);
        context.rotate(this.rotation + wobble);

        if (this.type === "door") {
          this.drawDoor(context);
        } else if (this.type === "pole") {
          this.drawPole(context);
        } else if (this.type === "box") {
          this.drawBox(context);
        } else {
          this.drawBarrier(context);
        }

        context.restore();
      }

      drawBarrier(context) {
        const left = -this.width / 2;
        const top = -this.height;

        context.fillStyle = this.colors.base;
        context.fillRect(left, top, this.width, this.height);

        context.fillStyle = this.colors.top;
        context.fillRect(left, top, this.width, 8);

        context.strokeStyle = this.colors.detail;
        context.lineWidth = 4;
        for (let offset = 10; offset < this.width - 8; offset += 16) {
          context.beginPath();
          context.moveTo(left + offset, top + 8);
          context.lineTo(left + offset - 8, -6);
          context.stroke();
        }
      }

      drawDoor(context) {
        const left = -this.width / 2;
        const top = -this.height;
        const openingTop = -(this.clearanceHeight || 0);
        const topPanelHeight = Math.max(18, this.height - this.clearanceHeight);
        const postWidth = Math.max(8, this.width * 0.16);

        context.fillStyle = this.colors.base;
        context.fillRect(left, top, this.width, topPanelHeight);
        context.fillRect(left, openingTop, postWidth, this.clearanceHeight);
        context.fillRect(left + this.width - postWidth, openingTop, postWidth, this.clearanceHeight);

        context.fillStyle = this.colors.detail;
        context.fillRect(left + this.width * 0.12, top + this.height * 0.16, this.width * 0.76, 10);
        context.fillRect(left + postWidth, openingTop + 8, this.width - postWidth * 2, 6);

        context.strokeStyle = this.colors.detail;
        context.lineWidth = 3;
        for (let offset = postWidth + 8; offset < this.width - postWidth - 8; offset += 16) {
          context.beginPath();
          context.moveTo(left + offset, openingTop + 6);
          context.lineTo(left + offset + 8, openingTop + 14);
          context.stroke();
        }

        context.fillStyle = this.colors.top;
        context.fillRect(left + this.width * 0.58, top + this.height * 0.54, 8, 8);
      }

      drawBox(context) {
        const left = -this.width / 2;
        const top = -this.height;

        context.fillStyle = this.colors.base;
        context.fillRect(left, top, this.width, this.height);

        context.strokeStyle = this.colors.detail;
        context.lineWidth = 3;
        context.strokeRect(left + 2, top + 2, this.width - 4, this.height - 4);
        context.beginPath();
        context.moveTo(left + 8, top + 8);
        context.lineTo(left + this.width - 8, top + this.height - 8);
        context.moveTo(left + this.width - 8, top + 8);
        context.lineTo(left + 8, top + this.height - 8);
        context.stroke();
      }

      drawPole(context) {
        const left = -this.width / 2;
        const top = -this.height;

        context.fillStyle = this.colors.base;
        context.fillRect(left + this.width * 0.3, top, this.width * 0.4, this.height);

        context.fillStyle = this.colors.top;
        context.fillRect(left, top + 10, this.width, 12);

        context.fillStyle = this.colors.detail;
        context.fillRect(left + this.width * 0.44, top + this.height * 0.4, 6, 10);
      }

      getCollisionRects(groundY) {
        if (this.type === "door") {
          return [
            {
              x: this.position.x - this.width / 2,
              y: groundY - this.height,
              width: this.width,
              height: this.height - this.clearanceHeight
            }
          ];
        }

        return [this.getBounds(groundY)];
      }

      getBounds(groundY) {
        return {
          x: this.position.x - this.width / 2,
          y: groundY - this.height,
          width: this.width,
          height: this.height
        };
      }

      isOffscreen(cameraX) {
        return this.position.x - cameraX + this.width < -160;
      }

      registerHit() {
        this.hitPlayer = true;
        this.hitPulse = 1;
      }
    }

    function createEnemyColors() {
      const hue = 6 + Math.random() * 18;
      const saturation = 38 + Math.random() * 18;
      const lightness = 18 + Math.random() * 8;

      return {
        main: `hsl(${hue}, ${saturation}%, ${lightness}%)`,
        back: `hsla(${hue}, ${saturation}%, ${lightness + 10}%, 0.45)`,
        head: `hsl(${hue + 8}, ${Math.max(20, saturation - 14)}%, 88%)`,
        rod: `hsl(${28 + Math.random() * 18}, 30%, ${34 + Math.random() * 10}%)`
      };
    }

    function spawnEnemies() {
      const count = 5 + Math.floor(Math.random() * 3);
      const enemies = [];
      const throwerCount = Math.max(3, Math.round(count * 0.55));
      const throwerIndexes = new Set();

      while (throwerIndexes.size < throwerCount) {
        throwerIndexes.add(Math.floor(Math.random() * count));
      }

      for (let index = 0; index < count; index += 1) {
        const scale = randomRange(0.88, 1.12);
        const spawnGap = viewport.width * 0.35 + index * randomRange(36, 58) + randomRange(10, 60);
        enemies.push(new Enemy({
          x: game.player.position.x - spawnGap,
          groundY: game.groundY,
          scale,
          colors: createEnemyColors(),
          hasRod: throwerIndexes.has(index),
          baseGap: index * randomRange(24, 40) + randomRange(-8, 10),
          speedOffset: randomRange(-28, 34)
        }));
      }

      game.enemies = enemies.sort((enemyA, enemyB) => enemyA.position.x - enemyB.position.x);
      refreshClosestEnemyDistance();
    }

    function pickObstacleType() {
      const roll = Math.random();
      if (roll < 0.34) {
        return "barrier";
      }
      if (roll < 0.58) {
        return "door";
      }
      if (roll < 0.82) {
        return "box";
      }
      return "pole";
    }

    function createObstacleConfig(type) {
      if (type === "door") {
        return {
          width: randomRange(44, 58),
          height: randomRange(102, 138),
          clearanceHeight: randomRange(78, 86),
          speedOffset: randomRange(10, 26),
          rotation: randomRange(-0.02, 0.03),
          colors: {
            base: "#42516a",
            top: "#dbe6ff",
            detail: "#7f95b5"
          }
        };
      }

      if (type === "pole") {
        return {
          width: randomRange(18, 28),
          height: randomRange(90, 124),
          speedOffset: randomRange(18, 34),
          rotation: randomRange(-0.03, 0.04),
          colors: {
            base: "#5b666d",
            top: "#d9b35e",
            detail: "#263039"
          }
        };
      }

      if (type === "box") {
        return {
          width: randomRange(40, 56),
          height: randomRange(36, 56),
          speedOffset: randomRange(8, 22),
          rotation: randomRange(-0.04, 0.04),
          colors: {
            base: "#8a633f",
            top: "#be8d60",
            detail: "#5b3d25"
          }
        };
      }

      return {
        width: randomRange(48, 76),
        height: randomRange(28, 46),
        speedOffset: randomRange(12, 28),
        rotation: randomRange(-0.03, 0.02),
        colors: {
          base: "#7c2d2d",
          top: "#f3d07c",
          detail: "#f3e6c2"
        }
      };
    }

    function getNextObstacleInterval() {
      const modifiers = eventSystem.getModifiers();
      const difficulty = clamp(game.timeSurvived / 70, 0, 1.65);
      const minInterval = Math.max(0.72, 1.72 - difficulty * 0.58);
      const maxInterval = Math.max(1.14, 2.78 - difficulty * 0.92);
      return randomRange(minInterval, maxInterval) * modifiers.obstacleInterval;
    }

    function scheduleNextObstacleSpawn(initial = false) {
      game.obstacleSpawnTimer = initial ? randomRange(1.05, 1.55) : getNextObstacleInterval();
    }

    function spawnObstacle(options = {}) {
      const type = pickObstacleType();
      const config = createObstacleConfig(type);
      const rightEdgeWorldX = game.cameraX + viewport.width;
      const spacingScale = options.spacingScale ?? 1;
      const minSpawnX = rightEdgeWorldX + randomRange(options.offsetMin ?? 90, options.offsetMax ?? 230);
      const spacedSpawnX = game.lastObstacleSpawnX + randomRange(170, 320) * spacingScale;
      const x = Math.max(minSpawnX, spacedSpawnX);
      const obstacle = new Obstacle({
        type,
        x,
        ...config
      });

      game.lastObstacleSpawnX = obstacle.position.x + obstacle.width * 0.5;
      game.obstacles.push(obstacle);
      playObstacleSpawnSound();
    }

    function showGameplayMessage(text, tone = "normal", duration = 1.5) {
      game.messageText = text;
      game.messageTone = tone;
      game.messageTimer = duration;
      game.messageDuration = duration;

      messageToast.textContent = text;
      messageToast.dataset.tone = tone;
      messageToast.classList.add("is-visible");
    }

    function updateMessageToast(dt) {
      if (game.messageTimer > 0) {
        game.messageTimer = Math.max(0, game.messageTimer - dt);
      }

      const visible = game.messageTimer > 0 && game.state !== GAME_STATES.GAMEOVER;
      messageToast.classList.toggle("is-visible", visible);

      if (!visible) {
        game.messageText = "";
      }
    }

    function toggleChaosMode(forceValue) {
      const nextValue = typeof forceValue === "boolean" ? forceValue : !game.chaosMode;
      if (game.chaosMode === nextValue) {
        return;
      }

      game.chaosMode = nextValue;
      eventSystem.scheduleNextEvent();
      showGameplayMessage(nextValue ? "Chaos Mode On" : "Normal Mode", nextValue ? "event" : "normal", 1.35);
      playUISound();
      refreshInterface();
    }

    function refreshInterface() {
      const score = game.state === GAME_STATES.GAMEOVER ? game.finalScore : game.timeSurvived;
      const showStart = game.state === GAME_STATES.START;
      const showGameOver = game.state === GAME_STATES.GAMEOVER && game.overlayVisible;
      const activeEventLabel = eventSystem.activeEvent ? eventSystem.activeEvent.label : "";
      const displayedScore = formatScore(score);
      const desiredModeText = `Chaos Mode: ${game.chaosMode ? "On" : "Off"}`;
      const desiredModeStatus = activeEventLabel || (game.chaosMode ? "Maximum paperwork" : "Balanced pursuit");

      if (scoreValue.textContent !== displayedScore) {
        scoreValue.textContent = displayedScore;
      }
      hud.classList.toggle("is-visible", game.state !== GAME_STATES.START);
      actionPanel.classList.toggle("is-visible", game.state === GAME_STATES.PLAYING);
      overlay.classList.toggle("is-visible", showStart || showGameOver);
      overlay.dataset.mode = showStart ? "start" : "gameover";
      overlayButton.disabled = game.state === GAME_STATES.GAMEOVER && !game.restartReady;
      overlayScore.classList.toggle("is-hidden", showStart);
      if (modeToggleButton.textContent !== desiredModeText) {
        modeToggleButton.textContent = desiredModeText;
      }
      modeToggleButton.classList.toggle("is-chaos", game.chaosMode);
      if (modeStatus.textContent !== desiredModeStatus) {
        modeStatus.textContent = desiredModeStatus;
      }

      if (showStart) {
        overlayKicker.textContent = "CID Pakad";
        overlayTitle.textContent = "Inspector Panic";
        overlaySubtitle.textContent = "Press Space / Click to Start";
        overlayScore.textContent = "";
        overlayMessage.textContent = game.chaosMode
          ? "Chaos Mode is armed. Press C or use the top-right toggle if you want mercy."
          : "Five inspectors are already warming up behind you. Press C for full chaos.";
        overlayButton.textContent = "Start Run";
      } else {
        overlayKicker.textContent = "Case File Closed";
        overlayTitle.textContent = "Game Over";
        overlaySubtitle.textContent = game.gameOverMessage;
        overlayScore.textContent = `Final Score: ${formatScore(game.finalScore)}`;
        overlayMessage.textContent = game.restartReady
          ? "Press Space or click to throw yourself back into the chaos."
          : "The squad is circling in slow motion...";
        overlayButton.textContent = "Restart";
      }
    }

    function resetWorld() {
      resetInputState();
      game.cameraX = 0;
      game.view.zoom = 1;
      game.view.rotation = 0;
      game.shakeOffset.x = 0;
      game.shakeOffset.y = 0;
      game.elapsedTime = 0;
      game.timeSurvived = 0;
      game.baseRunSpeed = game.baseRunSpeedStart;
      game.targetBaseRunSpeed = game.baseRunSpeedStart;
      game.closestEnemyDistance = Infinity;
      game.chasePressure = 0;
      game.desiredClosestDistance = 168;
      game.chaseVoiceCooldown = 0;
      game.feedbackIntensity = 0;
      game.obstacleSpawnTimer = 0;
      game.lastObstacleSpawnX = 0;
      game.cameraLookAhead = 0;
      game.obstacleSpeed = game.baseObstacleSpeed;
      game.enemyAggression = 0;
      game.targetEnemyAggression = 0;
      game.impactShake = 0;
      game.impactFlash = 0;
      game.finalScore = 0;
      game.gameOverMessage = "";
      game.gameOverReason = "caught";
      game.catchSequenceTimer = 0;
      game.overlayVisible = false;
      game.restartReady = false;
      game.chaosIntensity = game.chaosMode ? 0.4 : 0.12;
      game.nearCatchIntensity = 0;
      game.nearCatchPulse = 0;
      game.nearCatchPulseValue = 0;
      game.nearCatchSoundCooldown = 0;
      game.messageText = "";
      game.messageTone = "normal";
      game.messageTimer = 0;
      game.messageDuration = 0;
      game.obstacles = [];
      game.projectiles = [];
      game.enemies = [];
      game.player = new Player(viewport.width * 0.28, game.groundY);
      spawnEnemies();
      scheduleNextObstacleSpawn(true);
      eventSystem.reset();
      messageToast.classList.remove("is-visible");
      stopCatchAudio(true);
      syncAudioPlayback();
    }

    function enterStartState() {
      resetWorld();
      game.state = GAME_STATES.START;
      game.overlayVisible = true;
      syncAudioPlayback();
      refreshInterface();
    }

    function startRound() {
      resetWorld();
      game.state = GAME_STATES.PLAYING;
      syncAudioPlayback();
      refreshInterface();
    }

    function attemptPrimaryAction() {
      if (game.state === GAME_STATES.START) {
        playUISound();
        gameStateManager.startRound();
        return;
      }

      if (game.state === GAME_STATES.GAMEOVER && game.restartReady) {
        playUISound();
        gameStateManager.startRound();
      }
    }

    function updateStartScene(dt) {
      game.elapsedTime += dt * 0.74;
      game.player.runCycle += game.player.baseRunRate * dt * 0.62;
      game.player.renderBodyTilt = approach(game.player.renderBodyTilt, game.player.bodyTilt, 0.9 * dt);
      game.player.renderStrideOffset = approach(game.player.renderStrideOffset, 0.08, 1.2 * dt);
      game.player.renderStrideMultiplier = approach(game.player.renderStrideMultiplier, 1, 1.2 * dt);
      game.player.renderBobOffset = approach(game.player.renderBobOffset, 0.8, 6 * dt);
      game.player.renderHeadBob = approach(game.player.renderHeadBob, 0.6, 4 * dt);
      game.chaosIntensity = approach(game.chaosIntensity, game.chaosMode ? 0.38 : 0.14, 0.8 * dt);

      for (const enemy of game.enemies) {
        enemy.runCycle += enemy.baseRunRate * dt * 0.46;
        enemy.wanderX = Math.sin(game.elapsedTime * 2.7 + enemy.wobblePhase) * 4;
        enemy.wanderY = Math.cos(game.elapsedTime * 2.2 + enemy.wobblePhase) * 2;
      }

      game.view.zoom = approach(game.view.zoom, 1.01, 0.18 * dt);
      game.view.rotation = Math.sin(game.elapsedTime * 0.65) * 0.004;
      updateCamera(dt);
    }

    function updateCatchSequence(dt) {
      const sequenceBlend = clamp(game.catchSequenceTimer / game.catchSequenceDuration, 0, 1);
      const playerGroundY = game.groundY - game.player.legLength + (game.gameOverReason === "rod" ? 8 : 0);
      const targetCameraX = game.player.position.x - viewport.width * 0.42;

      game.player.position.y = approach(game.player.position.y, playerGroundY, 420 * dt);
      if (game.gameOverReason === "rod") {
        game.player.renderBodyTilt = approach(game.player.renderBodyTilt, 1.12, 2.2 * dt);
        game.player.renderStrideOffset = approach(game.player.renderStrideOffset, 0.62, 2.1 * dt);
        game.player.renderStrideMultiplier = approach(game.player.renderStrideMultiplier, 0.28, 1.9 * dt);
        game.player.renderBobOffset = approach(game.player.renderBobOffset, 7.2, 20 * dt);
        game.player.renderHeadBob = approach(game.player.renderHeadBob, -1.6, 8 * dt);
      } else {
        game.player.renderBodyTilt = approach(game.player.renderBodyTilt, -0.12, 1.4 * dt);
        game.player.renderStrideOffset = approach(game.player.renderStrideOffset, 0.36, 1.8 * dt);
        game.player.renderStrideMultiplier = approach(game.player.renderStrideMultiplier, 0.82, 1.5 * dt);
        game.player.renderBobOffset = approach(game.player.renderBobOffset, 2.8, 18 * dt);
        game.player.renderHeadBob = approach(game.player.renderHeadBob, 1.6, 6 * dt);
      }
      game.player.runCycle += game.player.baseRunRate * dt * (0.22 + (1 - sequenceBlend) * 0.18);

      const lastIndex = Math.max(1, game.enemies.length - 1);
      for (let index = 0; index < game.enemies.length; index += 1) {
        const enemy = game.enemies[index];
        const ratio = lastIndex === 0 ? 0.5 : index / lastIndex;
        const angle = -Math.PI * 0.86 + ratio * Math.PI * 1.08;
        const radiusX = 92 + (index % 3) * 24;
        const radiusY = Math.sin(game.elapsedTime * 2 + index) * 7;
        const targetX = game.player.position.x + Math.cos(angle) * radiusX;
        const targetY = game.groundY - enemy.legLength + Math.sin(angle) * 10 + radiusY;

        enemy.position.x = approach(enemy.position.x, targetX, (280 + index * 24) * dt);
        enemy.position.y = approach(enemy.position.y, targetY, 320 * dt);
        enemy.wanderX = Math.sin(game.elapsedTime * (4 + ratio) + enemy.wobblePhase) * 3.2;
        enemy.wanderY = Math.cos(game.elapsedTime * (3.5 + ratio) + enemy.wobblePhase) * 2.4;
        enemy.runCycle += enemy.baseRunRate * dt * (0.34 + (1 - sequenceBlend) * 0.18);
      }

      game.cameraX += (targetCameraX - game.cameraX) * Math.min(1, dt * 4);
      game.view.zoom = approach(game.view.zoom, 1.08 + sequenceBlend * 0.1, 0.9 * dt);
      game.view.rotation = approach(
        game.view.rotation,
        Math.sin(game.elapsedTime * 10.5) * 0.022 * (1 - sequenceBlend * 0.35),
        0.34 * dt
      );
      game.chaosIntensity = approach(game.chaosIntensity, 0.72, 0.9 * dt);
      game.impactShake = Math.max(game.impactShake, 0.94 - sequenceBlend * 0.72);
      game.impactFlash = Math.max(game.impactFlash, 0.9 - sequenceBlend * 1.4);

      if (game.catchSequenceTimer >= 0.52) {
        game.overlayVisible = true;
      }

      if (game.catchSequenceTimer >= 0.7) {
        game.restartReady = true;
      }
    }

    function updateGameOver(dt) {
      const slowMoFactor = game.catchSequenceTimer < 0.45 ? 0.24 : 0.4;

      game.elapsedTime += dt * slowMoFactor;
      game.catchSequenceTimer += dt;
      updateCatchSequence(dt);
    }

    function updateDifficulty(dt) {
      const modifiers = eventSystem.getModifiers();
      const playerTarget = (game.baseRunSpeedStart + Math.min(170, game.timeSurvived * 1.85)) * modifiers.playerSpeed;
      const obstacleTarget = (game.baseObstacleSpeed + Math.min(150, game.timeSurvived * 4.1)) * modifiers.obstacleSpeed;
      const aggressionTarget = (Math.min(34, game.timeSurvived * 0.42) + Math.min(16, game.timeSurvived * 0.12)) *
        modifiers.enemyAggression;

      game.targetBaseRunSpeed = playerTarget;
      game.targetEnemyAggression = aggressionTarget;
      game.baseRunSpeed = approach(game.baseRunSpeed, playerTarget, (80 + playerTarget * 0.16) * dt);
      game.obstacleSpeed = approach(game.obstacleSpeed, obstacleTarget, (100 + obstacleTarget * 0.22) * dt);
      game.enemyAggression = approach(game.enemyAggression, aggressionTarget, (16 + aggressionTarget * 1.4) * dt);
      game.chaosIntensity = approach(game.chaosIntensity, modifiers.visualChaos, 0.9 * dt);
    }

    function triggerObstacleImpact(obstacle) {
      obstacle.registerHit();
      game.player.applyStumble(randomRange(0.9, 1.25));
      game.player.position.x -= randomRange(8, 16);
      game.chasePressure = clamp(game.chasePressure + 16, 0, 108);
      game.impactShake = Math.max(game.impactShake, 1);
      game.impactFlash = Math.max(game.impactFlash, 1);
      playHitSound();
    }

    function spawnThrownRod(enemy, throwInfo) {
      const origin = enemy.getThrowOrigin(game.elapsedTime, throwInfo.lane);
      const targetX = game.player.position.x + (throwInfo.lane === "high" ? 22 : 10);
      const targetY = throwInfo.lane === "high"
        ? game.player.position.y - game.player.torsoLength * 0.72
        : game.groundY - 14;
      const gapX = Math.max(90, targetX - origin.x);
      const travelTime = clamp(gapX / ((game.baseRunSpeed + 240) * throwInfo.speedScale), 0.42, 0.82);
      const velocityX = gapX / travelTime;
      const gravity = game.gravity * 0.22;
      const velocityY = (targetY - origin.y - 0.5 * gravity * travelTime * travelTime) / travelTime;

      game.projectiles.push(new ThrownRod({
        x: origin.x,
        y: origin.y,
        velocityX,
        velocityY,
        length: enemy.rodLength * randomRange(1.7, 2.2),
        width: enemy.rodWidth * randomRange(0.86, 1.1),
        rotation: randomRange(-0.14, 0.14),
        angularVelocity: randomRange(-12, 12),
        color: enemy.colors.rod,
        tipColor: enemy.colors.main,
        lane: throwInfo.lane
      }));
    }

    function detectObstacleCollisions() {
      if (!game.player.canBeHit()) {
        return;
      }

      const playerBounds = game.player.getCollisionBounds();

      for (const obstacle of game.obstacles) {
        if (obstacle.hitPlayer) {
          continue;
        }

        const collisionRects = obstacle.getCollisionRects(game.groundY);
        for (const collisionRect of collisionRects) {
          if (rectsOverlap(playerBounds, collisionRect)) {
            triggerObstacleImpact(obstacle);
            return;
          }
        }
      }
    }

    function updateObstacles(dt) {
      game.obstacleSpawnTimer -= dt;
      while (game.obstacleSpawnTimer <= 0) {
        spawnObstacle();
        game.obstacleSpawnTimer += getNextObstacleInterval();
      }

      for (const obstacle of game.obstacles) {
        obstacle.update(dt, game);
      }

      detectObstacleCollisions();

      game.obstacles = game.obstacles.filter((obstacle) => !obstacle.isOffscreen(game.cameraX));
    }

    function refreshClosestEnemyDistance() {
      let closestDistance = Infinity;

      for (const enemy of game.enemies) {
        const enemyAnchor = enemy.getCollisionAnchor();
        const dx = game.player.position.x - enemyAnchor.x;
        const dy = (game.player.position.y + game.player.legLength * 0.2) - enemyAnchor.y;
        const distance = Math.hypot(dx, dy);
        closestDistance = Math.min(closestDistance, distance);
      }

      game.closestEnemyDistance = closestDistance;
    }

    function updateChasePressure(dt, playerJustJumped) {
      if (playerJustJumped) {
        game.chasePressure = clamp(game.chasePressure + 8, 0, 108);
      }

      const slowdownMistake = clamp(-game.player.horizontalAdjust / game.player.maxHorizontalAdjust, 0, 1);
      const airbornePressure = game.player.onGround ? 0 : 26;
      const stumblePressure = game.player.getMistakePressure() * 58;
      const recoveryPressure = 14 + clamp(game.player.horizontalAdjust / game.player.maxHorizontalAdjust, 0, 1) * 36;
      const pressureDelta = slowdownMistake * 72 + airbornePressure + stumblePressure - recoveryPressure;

      game.chasePressure = clamp(game.chasePressure + pressureDelta * dt, 0, 108);
      game.desiredClosestDistance = clamp(168 - game.chasePressure - game.enemyAggression * 0.6, 42, 168);
    }

    function updateEnemies(dt, playerJustJumped) {
      for (const enemy of game.enemies) {
        const throwInfo = enemy.update(dt, game, playerJustJumped);
        if (throwInfo) {
          spawnThrownRod(enemy, throwInfo);
        }
      }

      refreshClosestEnemyDistance();
    }

    function triggerProjectileImpact(projectile) {
      if (game.state !== GAME_STATES.PLAYING || projectile.hitPlayer) {
        return;
      }

      projectile.registerHit();
      game.player.applyProjectileHit();
      game.player.position.x -= randomRange(10, 18);
      game.impactShake = Math.max(game.impactShake, 1.18);
      game.impactFlash = Math.max(game.impactFlash, 1.14);
      gameStateManager.triggerGameOver("rod");
    }

    function detectProjectileCollisions() {
      const playerBounds = game.player.getProjectileCollisionBounds();

      for (const projectile of game.projectiles) {
        if (projectile.hitPlayer) {
          continue;
        }

        if (rectsOverlap(playerBounds, projectile.getBounds())) {
          triggerProjectileImpact(projectile);
          return;
        }
      }
    }

    function updateProjectiles(dt) {
      for (const projectile of game.projectiles) {
        projectile.update(dt, game);
      }

      detectProjectileCollisions();
      game.projectiles = game.projectiles.filter((projectile) => !projectile.isOffscreen(game.cameraX) && !projectile.hitPlayer);
    }

    function triggerGameOver(reason = "caught") {
      if (game.state === GAME_STATES.GAMEOVER) {
        return;
      }

      resetInputState();
      game.state = GAME_STATES.GAMEOVER;
      game.finalScore = game.timeSurvived;
      game.gameOverReason = reason;
      game.gameOverMessage = GAME_OVER_MESSAGES[
        Math.floor(Math.random() * GAME_OVER_MESSAGES.length)
      ];
      game.catchSequenceTimer = 0;
      game.overlayVisible = false;
      game.restartReady = false;
      game.closestEnemyDistance = 0;
      game.feedbackIntensity = 1;
      game.shakeOffset.x = 0;
      game.shakeOffset.y = 0;
      game.impactShake = Math.max(game.impactShake, 1.25);
      game.impactFlash = Math.max(game.impactFlash, 1.2);
      game.player.velocity.y = 0;
      game.player.jumpBufferTimer = 0;
      game.player.horizontalAdjust = 0;
      game.player.crouchProgress = 0;
      game.player.knockbackVelocity = 0;
      syncAudioPlayback();
      playCatchSound();
      playGameOverDialogue();
      refreshInterface();
    }

    function detectCatch() {
      const playerAnchor = {
        x: game.player.position.x,
        y: game.player.position.y + game.player.legLength * 0.18
      };

      for (const enemy of game.enemies) {
        const enemyAnchor = enemy.getCollisionAnchor();
        const dx = playerAnchor.x - enemyAnchor.x;
        const dy = playerAnchor.y - enemyAnchor.y;
        const distance = Math.hypot(dx, dy);

        if (distance <= enemy.catchRadius + 16) {
          gameStateManager.triggerGameOver("caught");
          return;
        }
      }
    }

    function updateImpactFeedback(dt) {
