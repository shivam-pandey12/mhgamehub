      game.impactShake = approach(game.impactShake, 0, 3.8 * dt);
      game.impactFlash = approach(game.impactFlash, 0, 4.8 * dt);
    }

    function updateProximityFeedback(dt) {
      const dangerStart = 260;
      const targetIntensity = game.state === GAME_STATES.GAMEOVER
        ? 1
        : game.state === GAME_STATES.START
          ? 0
        : clamp(1 - (game.closestEnemyDistance - 36) / (dangerStart - 36), 0, 1);
      const nearCatchTarget = game.state === GAME_STATES.PLAYING
        ? clamp(1 - (game.closestEnemyDistance - 24) / 120, 0, 1)
        : 0;

      game.feedbackIntensity = approach(
        game.feedbackIntensity,
        targetIntensity,
        (targetIntensity > game.feedbackIntensity ? 2.2 : 1.5) * dt
      );
      game.nearCatchIntensity = approach(
        game.nearCatchIntensity,
        nearCatchTarget,
        (nearCatchTarget > game.nearCatchIntensity ? 2.8 : 1.8) * dt
      );
      game.nearCatchPulse += dt * (2 + game.nearCatchIntensity * 5.6);
      game.nearCatchPulseValue = Math.pow((Math.sin(game.nearCatchPulse) + 1) * 0.5, 2.3);

      const modifiers = eventSystem.getModifiers();
      const shakeStrength = game.state === GAME_STATES.PLAYING
        ? (game.feedbackIntensity * 5.2 + game.nearCatchIntensity * 2.1 + game.nearCatchPulseValue * game.nearCatchIntensity * 2.4) *
          modifiers.shakeBoost
        : 0;
      const impactStrength = game.impactShake * 8.4 * modifiers.shakeBoost;
      game.shakeOffset.x =
        Math.sin(game.elapsedTime * 39) * shakeStrength +
        Math.cos(game.elapsedTime * 68) * impactStrength;
      game.shakeOffset.y =
        Math.cos(game.elapsedTime * 31) * shakeStrength * 0.65 +
        Math.sin(game.elapsedTime * 57) * impactStrength * 0.48;

      if (game.state === GAME_STATES.PLAYING) {
        game.nearCatchSoundCooldown = Math.max(0, game.nearCatchSoundCooldown - dt);
        if (game.nearCatchIntensity > 0.92 && eventSystem.nearCatchMessageCooldown <= 0) {
          showGameplayMessage(randomItem(NEAR_CATCH_MESSAGES), "danger", 1.05);
          eventSystem.nearCatchMessageCooldown = 2.3;
        }

        if (game.nearCatchIntensity > 0.84 && game.nearCatchPulseValue > 0.94 && game.nearCatchSoundCooldown <= 0) {
          playNearCatchSound();
          game.nearCatchSoundCooldown = 0.72;
        }
      }

      if (game.state === GAME_STATES.PLAYING && targetIntensity > 0.58) {
        game.chaseVoiceCooldown -= dt;
        if (game.chaseVoiceCooldown <= 0) {
          game.chaseVoiceCooldown = randomRange(0.7, 1.35);
          playChaseVoices();
        }
      } else {
        game.chaseVoiceCooldown = Math.max(0, game.chaseVoiceCooldown - dt);
      }
    }

    function updateCamera(dt) {
      const targetLookAhead = clamp(
        game.player.horizontalAdjust * 0.34 + (game.baseRunSpeed - game.baseRunSpeedStart) * 0.22,
        -32,
        72
      );
      game.cameraLookAhead = approach(game.cameraLookAhead, targetLookAhead, 220 * dt);

      const targetCameraX = game.player.position.x - viewport.width * 0.28 + game.cameraLookAhead;
      const followLag = 4.5 + game.nearCatchIntensity * 1.1 + (game.chaosMode ? 0.35 : 0);
      game.cameraX += (targetCameraX - game.cameraX) * Math.min(1, dt * followLag);
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, viewport.height);
      sky.addColorStop(0, palette.skyTop);
      sky.addColorStop(1, palette.skyBottom);

      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, viewport.width, viewport.height);
    }

    function drawGround(cameraX) {
      ctx.fillStyle = palette.groundBody;
      ctx.fillRect(0, game.groundY, viewport.width, viewport.height - game.groundY);

      ctx.strokeStyle = palette.groundTop;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, game.groundY);
      ctx.lineTo(viewport.width, game.groundY);
      ctx.stroke();

      ctx.strokeStyle = palette.groundDetail;
      ctx.lineWidth = 4;
      const dashSpacing = 74;
      const dashWidth = 28;
      const offset = ((cameraX * 0.9) % dashSpacing + dashSpacing) % dashSpacing;

      for (let x = -offset - dashSpacing; x < viewport.width + dashSpacing; x += dashSpacing) {
        ctx.beginPath();
        ctx.moveTo(x, game.groundY + 26);
        ctx.lineTo(x + dashWidth, game.groundY + 26);
        ctx.stroke();
      }
    }

    function renderObstacles() {
      for (let index = 0; index < game.obstacles.length; index += 1) {
        game.obstacles[index].render(ctx, game.cameraX, game.elapsedTime);
      }
    }

    function renderProjectiles() {
      for (let index = 0; index < game.projectiles.length; index += 1) {
        game.projectiles[index].render(ctx, game.cameraX);
      }
    }

    function renderEnemies() {
      for (const enemy of game.enemies) {
        if (enemy.position.x < game.player.position.x - 20) {
          enemy.render(ctx, game.cameraX, game.elapsedTime);
        }
      }

      game.player.render(ctx, game.cameraX);

      for (const enemy of game.enemies) {
        if (enemy.position.x >= game.player.position.x - 20) {
          enemy.render(ctx, game.cameraX, game.elapsedTime);
        }
      }
    }

    function drawDangerOverlay() {
      const alpha = game.state === GAME_STATES.GAMEOVER
        ? 0.34
        : game.state === GAME_STATES.START
          ? 0.06
        : game.feedbackIntensity * 0.16;

      if (alpha <= 0.001) {
        return;
      }

      const glow = ctx.createRadialGradient(
        viewport.width * 0.5,
        viewport.height * 0.48,
        viewport.height * 0.12,
        viewport.width * 0.5,
        viewport.height * 0.48,
        viewport.width * 0.72
      );

      glow.addColorStop(0, "rgba(255, 255, 255, 0)");
      glow.addColorStop(1, `rgba(182, 34, 34, ${alpha})`);

      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, viewport.width, viewport.height);
    }

    function drawImpactFlash() {
      if (game.impactFlash <= 0.001) {
        return;
      }

      ctx.fillStyle = `rgba(255, 255, 255, ${game.impactFlash * 0.08})`;
      ctx.fillRect(0, 0, viewport.width, viewport.height);
      ctx.fillStyle = `rgba(210, 66, 66, ${game.impactFlash * 0.12})`;
      ctx.fillRect(0, 0, viewport.width, viewport.height);
    }

    function drawNearCatchVignette() {
      const alpha = game.nearCatchIntensity * 0.22 + game.nearCatchPulseValue * game.nearCatchIntensity * 0.12;
      if (alpha <= 0.001) {
        return;
      }

      const vignette = ctx.createRadialGradient(
        viewport.width * 0.5,
        viewport.height * 0.5,
        viewport.height * 0.18,
        viewport.width * 0.5,
        viewport.height * 0.5,
        viewport.width * 0.7
      );

      vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
      vignette.addColorStop(0.64, `rgba(33, 12, 12, ${alpha * 0.2})`);
      vignette.addColorStop(1, `rgba(0, 0, 0, ${alpha})`);

      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, viewport.width, viewport.height);
    }

    function update(dt) {
      game.groundY = viewport.height * 0.82;
      if (game.state === GAME_STATES.START) {
        updateStartScene(dt);
      } else if (game.state === GAME_STATES.PLAYING) {
        game.elapsedTime += dt;
        game.timeSurvived += dt;
        eventSystem.update(dt);
        updateDifficulty(dt);

        const wasOnGround = game.player.onGround;
        game.player.update(dt, game, input);
        const playerJustJumped = wasOnGround && !game.player.onGround && game.player.velocity.y < 0;

        updateObstacles(dt);
        updateChasePressure(dt, playerJustJumped);
        updateEnemies(dt, playerJustJumped);
        if (game.state === GAME_STATES.PLAYING) {
          updateProjectiles(dt);
        }
        if (game.state === GAME_STATES.PLAYING) {
          detectCatch();
          updateCamera(dt);
        }
      } else if (game.state === GAME_STATES.GAMEOVER) {
        updateGameOver(dt);
      }

      syncAudioPlayback();
      updateImpactFeedback(dt);
      updateProximityFeedback(dt);
      updateMessageToast(dt);
      refreshInterface();

      input.jumpPressed = false;
    }

    function render() {
      ctx.clearRect(0, 0, viewport.width, viewport.height);
      ctx.save();
      const pulseZoom = game.state === GAME_STATES.PLAYING
        ? 1 + game.nearCatchPulseValue * game.nearCatchIntensity * 0.018
        : 1;
      ctx.translate(
        viewport.width * 0.5 + game.shakeOffset.x,
        viewport.height * 0.5 + game.shakeOffset.y
      );
      ctx.scale(game.view.zoom * pulseZoom, game.view.zoom * pulseZoom);
      ctx.rotate(game.view.rotation);
      ctx.translate(-viewport.width * 0.5, -viewport.height * 0.5);
      drawBackground();
      drawGround(game.cameraX);
      renderObstacles();
      renderProjectiles();
      renderEnemies();
      ctx.restore();
      drawDangerOverlay();
      drawNearCatchVignette();
      drawImpactFlash();
    }

    function gameLoop(timestamp) {
      if (!game.lastTime) {
        game.lastTime = timestamp;
      }

      const dt = Math.min((timestamp - game.lastTime) / 1000, 0.033);
      game.lastTime = timestamp;

      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    function handleKeyDown(event) {
      if (event.code === "KeyC") {
        event.preventDefault();
        toggleChaosMode();
        return;
      }

      if (event.code === "Space" && game.state === GAME_STATES.START) {
        event.preventDefault();
        attemptPrimaryAction();
        return;
      }

      if (event.code === "Space" && game.state === GAME_STATES.GAMEOVER && game.restartReady) {
        event.preventDefault();
        attemptPrimaryAction();
        return;
      }

      const action = KEY_ACTIONS[event.code];
      if (!action || game.state !== GAME_STATES.PLAYING) {
        return;
      }

      event.preventDefault();

      if (action === "jump") {
        if (!input.jumpHeld) {
          input.jumpPressed = true;
        }
        input.jumpHeld = true;
        return;
      }

      if (action === "duck") {
        input.duck = true;
        duckButton.classList.add("is-active");
        return;
      }

      input[action] = true;
    }

    function handleKeyUp(event) {
      const action = KEY_ACTIONS[event.code];
      if (!action) {
        return;
      }

      event.preventDefault();

      if (game.state !== GAME_STATES.PLAYING) {
        if (action === "jump") {
          input.jumpHeld = false;
        }
        if (action === "duck") {
          input.duck = false;
          duckButton.classList.remove("is-active");
        }
        return;
      }

      if (action === "jump") {
        input.jumpHeld = false;
        return;
      }

      if (action === "duck") {
        input.duck = false;
        duckButton.classList.remove("is-active");
        return;
      }

      input[action] = false;
    }

    function handleOverlayClick() {
      attemptPrimaryAction();
    }

    function handleDuckPointerDown(event) {
      event.preventDefault();
      if (game.state !== GAME_STATES.PLAYING) {
        return;
      }

      input.duck = true;
      duckButton.classList.add("is-active");
    }

    function handleDuckPointerUp(event) {
      event.preventDefault();
      input.duck = false;
      duckButton.classList.remove("is-active");
    }

    const gameStateManager = {
      enterStart: enterStartState,
      startRound,
      triggerGameOver,
      isPlaying() {
        return game.state === GAME_STATES.PLAYING;
      }
    };

    window.addEventListener("keydown", handleKeyDown);
    window.addEventListener("keyup", handleKeyUp);
    window.addEventListener("resize", resizeCanvas);
    document.addEventListener("visibilitychange", syncAudioPlayback);
    overlay.addEventListener("click", handleOverlayClick);
    overlayButton.addEventListener("click", attemptPrimaryAction);
    modeToggleButton.addEventListener("click", toggleChaosMode);
    duckButton.addEventListener("pointerdown", handleDuckPointerDown);
    duckButton.addEventListener("pointerup", handleDuckPointerUp);
    duckButton.addEventListener("pointercancel", handleDuckPointerUp);
    duckButton.addEventListener("pointerleave", handleDuckPointerUp);

    syncPalette();
    resizeCanvas();
    gameStateManager.enterStart();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
