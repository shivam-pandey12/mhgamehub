<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stick Hero - Bridge Timing Challenge</title>
  <style>html,
body {
  height: 100%;
  width: 100%;
}

:root {
  color-scheme: dark;
  --page-bg: #0f172a;
  --panel-border: rgba(255, 255, 255, 0.08);
  --text-main: #e5edf8;
  --text-muted: #9fb0ca;
  --canvas-bg: #dceeff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, rgba(113, 176, 255, 0.2), transparent 45%),
    linear-gradient(180deg, #0c1320 0%, var(--page-bg) 100%);
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text-main);
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
}

.game-shell {
  width: 100vw;
  height: 100vh;
  padding: clamp(6px, 1.2vmin, 16px);
}

.panel {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  padding: clamp(10px, 1.5vmin, 18px);
  border: 1px solid var(--panel-border);
  border-radius: clamp(16px, 2vmin, 24px);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
}

.panel-header {
  flex: 0 0 auto;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: clamp(10px, 2vw, 28px);
  margin-bottom: clamp(8px, 1.4vmin, 16px);
}

.panel-header h1 {
  flex: 0 0 auto;
  margin: 0;
  font-size: clamp(1.7rem, 4.4vmin, 2.85rem);
  line-height: 1;
  letter-spacing: -0.02em;
}

.panel-header p {
  flex: 1 1 auto;
  margin: 0;
  color: var(--text-muted);
  font-size: clamp(0.9rem, 2.3vmin, 1.16rem);
  line-height: 1.35;
  text-align: right;
}

.canvas-wrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  border-radius: clamp(14px, 1.6vmin, 18px);
  isolation: isolate;
  background: #020617;
}

#gameCanvas {
  width: 100%;
  height: 100%;
  display: block;
  background: var(--canvas-bg);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
  cursor: pointer;
  touch-action: none;
  user-select: none;
}

.selection-overlay,
.game-over-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 22px;
  overflow-y: auto;
}

.selection-overlay[hidden],
.game-over-overlay[hidden] {
  display: none;
}

.selection-overlay {
  z-index: 3;
  background:
    linear-gradient(180deg, rgba(15, 23, 42, 0.26), rgba(15, 23, 42, 0.62)),
    radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 36%);
  backdrop-filter: blur(7px);
}

.game-over-overlay {
  z-index: 4;
  background: rgba(15, 23, 42, 0.54);
  backdrop-filter: blur(4px);
}

.selection-card,
.game-over-card {
  width: min(100%, 760px);
  max-height: 100%;
  padding: 28px 26px;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.94);
  color: #0f172a;
  box-shadow: 0 18px 50px rgba(15, 23, 42, 0.28);
  overflow-y: auto;
}

.selection-label,
.game-over-label {
  margin: 0 0 8px;
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #475569;
}

.selection-card h2,
.game-over-card h2 {
  margin: 0 0 12px;
  font-size: clamp(2rem, 5vw, 2.6rem);
  line-height: 1;
}

.selection-description {
  margin: 0;
  min-height: 48px;
  color: #334155;
  font-size: 1rem;
}

.selection-note,
.game-over-score,
.game-over-best {
  margin: 0 0 20px;
  color: #475569;
  font-size: 1rem;
}

.game-over-best {
  margin-top: -10px;
}

.game-over-hint {
  margin: -8px 0 18px;
  color: #64748b;
  font-size: 0.95rem;
}

.character-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin: 22px 0 18px;
}

.character-option {
  border: 1px solid rgba(148, 163, 184, 0.3);
  border-radius: 18px;
  padding: 16px;
  background: linear-gradient(180deg, rgba(248, 250, 252, 0.92), rgba(241, 245, 249, 0.96));
  color: #0f172a;
  text-align: left;
  cursor: pointer;
  transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
}

.character-option:hover {
  transform: translateY(-2px);
}

.character-option[data-selected="true"] {
  border-color: var(--card-accent, #ef4444);
  box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.05), 0 12px 28px rgba(15, 23, 42, 0.12);
}

.character-name-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.character-name {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 700;
}

.character-badge {
  flex: 0 0 auto;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.08);
  color: var(--card-accent, #ef4444);
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.character-ability,
.character-style {
  margin: 0;
  font-size: 0.95rem;
  color: #334155;
}

.character-style {
  margin-top: 8px;
  color: #64748b;
}

#startButton,
#restartButton {
  border: 0;
  border-radius: 999px;
  padding: 12px 24px;
  font: inherit;
  font-weight: 700;
  color: #ffffff;
  background: linear-gradient(135deg, #ef4444, #f97316);
  cursor: pointer;
  box-shadow: 0 12px 24px rgba(239, 68, 68, 0.28);
  transition: transform 120ms ease, box-shadow 120ms ease;
}

#startButton:hover,
#restartButton:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(239, 68, 68, 0.32);
}

#startButton:active,
#restartButton:active {
  transform: translateY(0);
}

#startButton:focus-visible,
#restartButton:focus-visible {
  outline: 3px solid rgba(249, 115, 22, 0.35);
  outline-offset: 3px;
}

.game-over-card {
  min-width: min(90%, 320px);
  text-align: center;
}

@media (max-width: 700px) {
  .game-shell {
    padding: 8px;
  }

  .panel {
    padding: 12px;
    border-radius: 18px;
  }

  .panel-header {
    display: grid;
    gap: 6px;
  }

  .panel-header p {
    font-size: 0.95rem;
    text-align: left;
  }

  .selection-overlay,
  .game-over-overlay {
    padding: 14px;
  }

  .selection-card,
  .game-over-card {
    padding: 20px 16px;
  }

  .character-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-height: 560px) and (orientation: landscape) {
  .panel-header {
    align-items: center;
    margin-bottom: 8px;
  }

  .panel-header h1 {
    font-size: clamp(1.45rem, 5.4vh, 2rem);
  }

  .panel-header p {
    font-size: clamp(0.82rem, 3.4vh, 1rem);
  }
}
</style>
</head>
<body>
  <main class="game-shell">
    <section class="panel">
      <header class="panel-header">
        <h1>Stick Hero</h1>
        <p>Choose a character, then hold mouse or space to grow the stick.</p>
      </header>

      <div class="canvas-wrap">
        <canvas
          id="gameCanvas"
          width="960"
          height="540"
          aria-label="Stick Hero game canvas"
        ></canvas>

        <div class="selection-overlay" id="selectionOverlay">
          <div class="selection-card">
            <p class="selection-label">Character Select</p>
            <h2>Pick Your Hero</h2>
            <p class="selection-description" id="characterDescription"></p>
            <div class="character-grid" id="characterGrid"></div>
            <p class="selection-note">Backgrounds rotate through Day, Night, and Neon City as you progress.</p>
            <button id="startButton" type="button">Start Game</button>
          </div>
        </div>

        <div class="game-over-overlay" id="gameOverOverlay" hidden>
          <div class="game-over-card">
            <p class="game-over-label">Run ended</p>
            <h2>Game Over</h2>
            <p class="game-over-score">Final score: <span id="finalScore">0</span></p>
            <p class="game-over-best">Best score: <span id="bestScore">0</span></p>
            <p class="game-over-hint">Press space or click to instantly retry.</p>
            <button id="restartButton" type="button">Restart</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script >const PLATFORM_TYPES = {
  normal: {
    fillColor: "#1f2937",
    accentColor: "#64748b",
    perfectZoneColor: "#fb7185"
  },
  moving: {
    fillColor: "#2563eb",
    accentColor: "#93c5fd",
    perfectZoneColor: "#fef08a"
  },
  breakable: {
    fillColor: "#92400e",
    accentColor: "#fdba74",
    perfectZoneColor: "#fde68a"
  },
  slippery: {
    fillColor: "#0f766e",
    accentColor: "#99f6e4",
    perfectZoneColor: "#e0f2fe"
  }
};

const POWER_UP_TYPES = {
  rescue: {
    type: "rescue",
    label: "Rescue",
    badge: "SAVE",
    color: "#22c55e",
    glowColor: "34, 197, 94"
  },
  bonus: {
    type: "bonus",
    label: "Boost",
    badge: "+2",
    color: "#f59e0b",
    glowColor: "245, 158, 11"
  }
};

const CHARACTERS = {
  default: {
    id: "default",
    name: "Default",
    badge: "Balanced",
    description: "Balanced timing and movement for a classic run.",
    styleText: "Classic red hero with a charcoal stick.",
    growSpeedMultiplier: 1,
    landingBounceMultiplier: 1,
    slideMultiplier: 1,
    correctionMargin: 0,
    startingTheme: "day",
    stickColor: "#111827",
    stickGlowColor: "17, 24, 39",
    trailColor: "100, 116, 139",
    bodyColor: "#ef4444",
    accentColor: "#f59e0b",
    auraColor: "239, 68, 68",
    alpha: 1
  },
  ninja: {
    id: "ninja",
    name: "Ninja",
    badge: "Fast Grow",
    description: "Grows the stick faster, making quick reactions easier.",
    styleText: "Crimson headband, sharp silhouette, ember trail.",
    growSpeedMultiplier: 1.35,
    landingBounceMultiplier: 0.95,
    slideMultiplier: 1,
    correctionMargin: 0,
    startingTheme: "night",
    stickColor: "#7f1d1d",
    stickGlowColor: "185, 28, 28",
    trailColor: "248, 113, 113",
    bodyColor: "#991b1b",
    accentColor: "#fca5a5",
    auraColor: "248, 113, 113",
    alpha: 1
  },
  heavy: {
    id: "heavy",
    name: "Heavy",
    badge: "Stable",
    description: "Lands with less bounce and slides much less on slippery platforms.",
    styleText: "Stockier build, bronze palette, weighty golden stick.",
    growSpeedMultiplier: 1,
    landingBounceMultiplier: 0.55,
    slideMultiplier: 0.35,
    correctionMargin: 0,
    startingTheme: "day",
    stickColor: "#78350f",
    stickGlowColor: "217, 119, 6",
    trailColor: "251, 191, 36",
    bodyColor: "#b45309",
    accentColor: "#fde68a",
    auraColor: "251, 191, 36",
    alpha: 1
  },
  ghost: {
    id: "ghost",
    name: "Ghost",
    badge: "Correction",
    description: "Near misses get a small automatic correction to save the crossing.",
    styleText: "Translucent glow, spectral cyan stick, misty trail.",
    growSpeedMultiplier: 1,
    landingBounceMultiplier: 1,
    slideMultiplier: 1,
    correctionMargin: 18,
    startingTheme: "neon",
    stickColor: "#22d3ee",
    stickGlowColor: "34, 211, 238",
    trailColor: "103, 232, 249",
    bodyColor: "#67e8f9",
    accentColor: "#ecfeff",
    auraColor: "34, 211, 238",
    alpha: 0.82
  }
};

const BACKGROUND_THEMES = ["day", "night", "neon"];

const BACKGROUND_NAMES = {
  day: "Day",
  night: "Night",
  neon: "Neon City"
};

class Platform {
  constructor({
    x,
    width,
    topY,
    canvasHeight,
    perfectZoneWidth,
    type = "normal",
    motionRange,
    motionSpeed
  }) {
    this.x = x;
    this.width = width;
    this.topY = topY;
    this.height = canvasHeight - topY;
    this.perfectZoneWidth = perfectZoneWidth;
    this.type = type;
    this.theme = PLATFORM_TYPES[type] ?? PLATFORM_TYPES.normal;

    this.motionBaseX = x;
    this.motionDirection = Math.random() > 0.5 ? 1 : -1;
    this.motionRange = Math.max(0, motionRange ?? 0);
    this.motionSpeed = Math.max(0, motionSpeed ?? 0);

    this.hasBeenLandedOn = false;
    this.isCracked = false;
    this.isCrumbling = false;
    this.crumbleProgress = 0;
    this.powerUp = null;
    this.powerUpFloat = Math.random() * Math.PI * 2;
  }

  get right() {
    return this.x + this.width;
  }

  get center() {
    return this.x + this.width / 2;
  }

  get perfectZoneLeft() {
    return this.center - this.perfectZoneWidth / 2;
  }

  get perfectZoneRight() {
    return this.center + this.perfectZoneWidth / 2;
  }

  setX(x, resetMotionBase = false) {
    const delta = x - this.x;
    this.x = x;
    this.motionBaseX = resetMotionBase ? x : this.motionBaseX + delta;
  }

  shift(distance) {
    this.x -= distance;
    this.motionBaseX -= distance;
  }

  update(deltaTime, allowMovement) {
    this.powerUpFloat += deltaTime * 3;

    if (!allowMovement || this.motionRange <= 0 || this.motionSpeed <= 0) {
      return;
    }

    this.x += this.motionDirection * this.motionSpeed * deltaTime;

    const minX = this.motionBaseX - this.motionRange;
    const maxX = this.motionBaseX + this.motionRange;

    if (this.x <= minX) {
      this.x = minX;
      this.motionDirection = 1;
    } else if (this.x >= maxX) {
      this.x = maxX;
      this.motionDirection = -1;
    }
  }

  registerLanding() {
    this.hasBeenLandedOn = true;

    if (this.type === "breakable") {
      this.isCracked = true;
    }
  }

  startCrumble() {
    if (this.type === "breakable" && this.hasBeenLandedOn) {
      this.isCrumbling = true;
    }
  }

  updateCrumble(deltaTime) {
    if (!this.isCrumbling) {
      return;
    }

    this.crumbleProgress = Math.min(1, this.crumbleProgress + deltaTime * 2.3);
  }

  drawSlab(ctx, x, y, width, height, glowStrength) {
    if (glowStrength > 0) {
      ctx.save();
      ctx.shadowColor = `rgba(250, 204, 21, ${0.75 * glowStrength})`;
      ctx.shadowBlur = 22 + glowStrength * 18;
      ctx.fillStyle = this.theme.fillColor;
      ctx.fillRect(x, y, width, height);
      ctx.restore();
    }

    ctx.fillStyle = this.theme.fillColor;
    ctx.fillRect(x, y, width, height);

    ctx.fillStyle = this.theme.accentColor;
    ctx.fillRect(x, y, width, 10);
  }

  drawDecor(ctx, baseAlpha) {
    switch (this.type) {
      case "moving":
        ctx.fillStyle = `rgba(255, 255, 255, ${0.26 * baseAlpha})`;
        for (let x = this.x + 18; x <= this.right - 28; x += 28) {
          ctx.beginPath();
          ctx.moveTo(x, this.topY + 22);
          ctx.lineTo(x + 10, this.topY + 16);
          ctx.lineTo(x + 10, this.topY + 28);
          ctx.closePath();
          ctx.fill();
        }
        break;

      case "breakable":
        if (!this.isCracked && !this.isCrumbling) {
          break;
        }

        ctx.strokeStyle = `rgba(255, 248, 235, ${0.65 * baseAlpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x + this.width * 0.18, this.topY + 12);
        ctx.lineTo(this.x + this.width * 0.34, this.topY + 28);
        ctx.lineTo(this.x + this.width * 0.29, this.topY + 44);
        ctx.moveTo(this.x + this.width * 0.6, this.topY + 12);
        ctx.lineTo(this.x + this.width * 0.48, this.topY + 26);
        ctx.lineTo(this.x + this.width * 0.58, this.topY + 42);
        ctx.stroke();
        break;

      case "slippery":
        ctx.fillStyle = `rgba(255, 255, 255, ${0.24 * baseAlpha})`;
        ctx.fillRect(this.x + 12, this.topY + 16, this.width - 24, 9);

        ctx.strokeStyle = `rgba(224, 242, 254, ${0.72 * baseAlpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x + 18, this.topY + 34);
        ctx.lineTo(this.x + 44, this.topY + 20);
        ctx.moveTo(this.x + 54, this.topY + 34);
        ctx.lineTo(this.x + 80, this.topY + 20);
        ctx.moveTo(this.right - 62, this.topY + 34);
        ctx.lineTo(this.right - 36, this.topY + 20);
        ctx.stroke();
        break;
    }
  }

  setPowerUp(type) {
    this.powerUp = type ? { ...(POWER_UP_TYPES[type] ?? POWER_UP_TYPES.bonus) } : null;
  }

  clearPowerUp() {
    this.powerUp = null;
  }

  drawPowerUp(ctx) {
    if (!this.powerUp) {
      return;
    }

    const centerX = this.center;
    const bobOffset = Math.sin(this.powerUpFloat) * 6;
    const centerY = this.topY - 34 + bobOffset;

    ctx.save();
    ctx.shadowColor = `rgba(${this.powerUp.glowColor}, 0.6)`;
    ctx.shadowBlur = 18;
    ctx.fillStyle = this.powerUp.color;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
    ctx.font = "700 10px Segoe UI";
    ctx.textAlign = "center";
    ctx.fillText(this.powerUp.badge, centerX, centerY + 3.5);
    ctx.restore();
  }

  draw(ctx, glowStrength = 0) {
    const baseAlpha =
      this.type === "breakable" && this.isCrumbling
        ? 1 - this.crumbleProgress * 0.82
        : 1;

    ctx.save();
    ctx.globalAlpha = baseAlpha;

    if (this.type === "breakable" && (this.isCracked || this.isCrumbling)) {
      const splitGap = 4 + this.crumbleProgress * 8;
      const leftWidth = this.width * 0.48;
      const rightX = this.x + leftWidth + splitGap;
      const rightWidth = Math.max(12, this.right - rightX);
      const leftDrop = this.crumbleProgress * 8;
      const rightDrop = this.crumbleProgress * 16;

      this.drawSlab(ctx, this.x, this.topY + leftDrop, leftWidth, this.height, glowStrength);
      this.drawSlab(ctx, rightX, this.topY + rightDrop, rightWidth, this.height, glowStrength);
    } else {
      this.drawSlab(ctx, this.x, this.topY, this.width, this.height, glowStrength);
    }

    this.drawDecor(ctx, baseAlpha);

    ctx.fillStyle = glowStrength > 0 ? "#fde047" : this.theme.perfectZoneColor;
    ctx.fillRect(this.perfectZoneLeft, this.topY - 14, this.perfectZoneWidth, 14);
    this.drawPowerUp(ctx);
    ctx.restore();
  }
}

class Stick {
  constructor() {
    this.baseX = 0;
    this.baseY = 0;
    this.length = 0;
    this.angle = -Math.PI / 2;
    this.color = "#111827";
    this.glowColor = "17, 24, 39";
  }

  reset(baseX, baseY) {
    this.baseX = baseX;
    this.baseY = baseY;
    this.length = 0;
    this.angle = -Math.PI / 2;
  }

  setCharacter(profile) {
    this.color = profile.stickColor;
    this.glowColor = profile.stickGlowColor;
  }

  get tipX() {
    return this.baseX + Math.cos(this.angle) * this.length;
  }

  get tipY() {
    return this.baseY + Math.sin(this.angle) * this.length;
  }

  draw(ctx, isGrowing) {
    if (this.length <= 0) {
      return;
    }

    ctx.save();
    ctx.translate(this.baseX, this.baseY);
    ctx.rotate(this.angle);

    if (isGrowing) {
      ctx.shadowColor = `rgba(${this.glowColor}, 0.32)`;
      ctx.shadowBlur = 14;
    }

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(this.length, 0);
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.strokeStyle = this.color;
    ctx.stroke();
    ctx.restore();
  }
}

class Player {
  constructor(width, height) {
    this.width = width;
    this.height = height;
    this.profile = CHARACTERS.default;
    this.reset(0, 0);
  }

  setCharacter(profile) {
    this.profile = profile;
  }

  reset(x, y) {
    this.x = x;
    this.y = y;
    this.vy = 0;
    this.fallTilt = 0;
  }

  getPose() {
    const swing = Math.sin(this.x * 0.16);
    const sway = Math.cos(this.x * 0.14);
    const motionBlend = this.vy !== 0 ? 0.35 : 1;

    return {
      stride: swing * 2.2 * motionBlend,
      armSwing: sway * 1.7 * motionBlend
    };
  }

  traceRoundedRect(ctx, x, y, width, height, radius) {
    const safeRadius = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + safeRadius, y);
    ctx.lineTo(x + width - safeRadius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
    ctx.lineTo(x + width, y + height - safeRadius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
    ctx.lineTo(x + safeRadius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
    ctx.lineTo(x, y + safeRadius);
    ctx.quadraticCurveTo(x, y, x + safeRadius, y);
    ctx.closePath();
  }

  fillRoundedRect(ctx, x, y, width, height, radius, fillStyle) {
    this.traceRoundedRect(ctx, x, y, width, height, radius);
    ctx.fillStyle = fillStyle;
    ctx.fill();
  }

  drawLimb(ctx, startX, startY, controlX, controlY, endX, endY, color, lineWidth) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(controlX, controlY, endX, endY);
    ctx.stroke();
  }

  drawBoot(ctx, x, y, width, height, color) {
    this.fillRoundedRect(ctx, x, y, width, height, 2.4, color);
  }

  drawHumanHead(ctx, options) {
    const {
      faceColor,
      hairColor,
      eyeColor = "#0f172a",
      maskColor = null,
      bandColor = null,
      glowColor = null
    } = options;

    if (glowColor) {
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 14;
    }

    ctx.fillStyle = faceColor;
    ctx.beginPath();
    ctx.arc(this.width / 2, 8.5, 6.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.arc(this.width / 2, 7.2, 6.4, Math.PI, Math.PI * 2);
    ctx.fill();

    if (bandColor) {
      ctx.fillStyle = bandColor;
      this.fillRoundedRect(ctx, this.width / 2 - 6.2, 6.8, 12.4, 2.2, 1.1, bandColor);
    }

    if (maskColor) {
      this.fillRoundedRect(ctx, this.width / 2 - 5.7, 8.3, 11.4, 5.4, 2.4, maskColor);
    }

    ctx.fillStyle = eyeColor;
    ctx.beginPath();
    ctx.arc(this.width / 2 + 1.2, 8.8, 0.95, 0, Math.PI * 2);
    ctx.fill();
  }

  drawDefault(ctx) {
    const { stride, armSwing } = this.getPose();
    const coatGradient = ctx.createLinearGradient(4, 14, 20, 42);
    coatGradient.addColorStop(0, "#fb7185");
    coatGradient.addColorStop(1, this.profile.bodyColor);

    this.drawLimb(ctx, 8, 35, 7 - stride * 0.3, 42, 6 - stride, 49, "#243042", 4.4);
    this.drawLimb(ctx, 15, 35, 16 + stride * 0.3, 42, 17 + stride, 49, "#243042", 4.4);
    this.drawBoot(ctx, 2.8 - stride, 47.6, 7.3, 4.3, "#111827");
    this.drawBoot(ctx, 14.2 + stride - 0.4, 47.6, 7.3, 4.3, "#111827");

    this.drawLimb(ctx, 6.6, 21, 4.5, 28 + armSwing * 0.6, 5.6 - armSwing * 0.5, 34, "#7f1d1d", 4);
    this.drawLimb(ctx, 17.2, 21, 19.4, 28 - armSwing * 0.6, 18.3 + armSwing * 0.5, 34, "#7f1d1d", 4);

    this.fillRoundedRect(ctx, 5.2, 14, 13.6, 19.2, 5, coatGradient);
    this.fillRoundedRect(ctx, 7, 14.8, 10, 3.2, 1.6, this.profile.accentColor);
    this.fillRoundedRect(ctx, 8.2, 18.6, 7.2, 12.6, 2.8, "rgba(255, 255, 255, 0.14)");

    this.drawHumanHead(ctx, {
      faceColor: "#f4c7a4",
      hairColor: "#1f2937"
    });

    ctx.fillStyle = this.profile.accentColor;
    ctx.beginPath();
    ctx.moveTo(7.4, 14.6);
    ctx.lineTo(5.3, 19.2);
    ctx.lineTo(8.3, 18.1);
    ctx.closePath();
    ctx.fill();
  }

  drawNinja(ctx) {
    const { stride, armSwing } = this.getPose();

    this.drawLimb(ctx, 8.8, 34.4, 7.4 - stride * 0.28, 41.4, 7.2 - stride, 49.2, "#111827", 4);
    this.drawLimb(ctx, 14.6, 34.4, 15.6 + stride * 0.28, 41.4, 15.4 + stride, 49.2, "#111827", 4);
    this.drawBoot(ctx, 4.2 - stride, 47.5, 6.6, 4, "#020617");
    this.drawBoot(ctx, 13.3 + stride, 47.5, 6.6, 4, "#020617");

    this.drawLimb(ctx, 7.4, 20.6, 4.7, 27.5 + armSwing, 5.8 - armSwing * 0.7, 32.8, "#0f172a", 3.6);
    this.drawLimb(ctx, 16.4, 20.6, 19.1, 27.5 - armSwing, 18.1 + armSwing * 0.7, 32.8, "#0f172a", 3.6);

    const suitGradient = ctx.createLinearGradient(6, 13, 18, 34);
    suitGradient.addColorStop(0, "#111827");
    suitGradient.addColorStop(1, this.profile.bodyColor);
    this.fillRoundedRect(ctx, 6.4, 13.4, 11.2, 20, 4.2, suitGradient);
    this.fillRoundedRect(ctx, 7.8, 24.3, 8.5, 2.7, 1.3, this.profile.accentColor);
    this.fillRoundedRect(ctx, 8.6, 15.4, 6.8, 10.2, 2.4, "rgba(255, 255, 255, 0.08)");

    this.drawHumanHead(ctx, {
      faceColor: "#f0c4a4",
      hairColor: "#0f172a",
      maskColor: "#111827",
      bandColor: this.profile.accentColor
    });

    ctx.fillStyle = this.profile.accentColor;
    ctx.beginPath();
    ctx.moveTo(18.4, 8.5);
    ctx.lineTo(23, 10.7);
    ctx.lineTo(18.7, 12.1);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(18.1, 10.3);
    ctx.lineTo(22.4, 14);
    ctx.lineTo(17.7, 13.2);
    ctx.closePath();
    ctx.fill();
  }

  drawHeavy(ctx) {
    const { stride, armSwing } = this.getPose();

    this.drawLimb(ctx, 8.4, 35, 7.2 - stride * 0.24, 42.5, 7.2 - stride, 49.8, "#4b5563", 5.2);
    this.drawLimb(ctx, 15.8, 35, 17 + stride * 0.24, 42.5, 17 + stride, 49.8, "#4b5563", 5.2);
    this.drawBoot(ctx, 3 - stride, 47.5, 8.1, 4.8, "#292524");
    this.drawBoot(ctx, 13.2 + stride, 47.5, 8.1, 4.8, "#292524");

    this.drawLimb(ctx, 5.9, 21.5, 2.5, 28.4 + armSwing * 0.5, 4.1 - armSwing * 0.35, 34.6, "#6b7280", 4.8);
    this.drawLimb(ctx, 18.3, 21.5, 21.7, 28.4 - armSwing * 0.5, 20.1 + armSwing * 0.35, 34.6, "#6b7280", 4.8);

    const armorGradient = ctx.createLinearGradient(2, 12, 22, 36);
    armorGradient.addColorStop(0, "#f59e0b");
    armorGradient.addColorStop(1, this.profile.bodyColor);
    this.fillRoundedRect(ctx, 3.4, 12.8, 17.2, 22, 5.4, armorGradient);
    this.fillRoundedRect(ctx, 1.8, 17.1, 5.6, 6.4, 2.6, "#78350f");
    this.fillRoundedRect(ctx, 16.6, 17.1, 5.6, 6.4, 2.6, "#78350f");
    this.fillRoundedRect(ctx, 7.1, 16.4, 9.8, 10.8, 3, this.profile.accentColor);
    this.fillRoundedRect(ctx, 8.3, 27.8, 7.2, 3.2, 1.6, "rgba(120, 53, 15, 0.78)");

    this.drawHumanHead(ctx, {
      faceColor: "#d1d5db",
      hairColor: "#78350f",
      maskColor: "#7c2d12"
    });

    this.fillRoundedRect(ctx, 6, 5.8, 12, 4, 1.8, "#92400e");
    this.fillRoundedRect(ctx, 7.7, 9.1, 8.6, 2.2, 1, "#fde68a");
  }

  drawGhost(ctx) {
    const { stride } = this.getPose();
    const spectralGradient = ctx.createLinearGradient(4, 12, 18, 50);
    spectralGradient.addColorStop(0, `rgba(236, 254, 255, ${Math.min(1, this.profile.alpha + 0.16)})`);
    spectralGradient.addColorStop(0.55, `rgba(103, 232, 249, ${this.profile.alpha})`);
    spectralGradient.addColorStop(1, "rgba(34, 211, 238, 0.14)");

    ctx.shadowColor = `rgba(${this.profile.auraColor}, 0.48)`;
    ctx.shadowBlur = 18;
    ctx.fillStyle = spectralGradient;
    ctx.beginPath();
    ctx.moveTo(12, 13);
    ctx.quadraticCurveTo(19, 13, 18.2, 25);
    ctx.quadraticCurveTo(17.8, 37, 20.1, 47);
    ctx.quadraticCurveTo(17.8, 45.8, 15.8, 50.5);
    ctx.quadraticCurveTo(13.8, 45.2, 12.2, 51.4);
    ctx.quadraticCurveTo(10.2, 45.8, 8.2, 50.2);
    ctx.quadraticCurveTo(6.8, 44.6, 4.2, 47.2);
    ctx.quadraticCurveTo(6.2, 36.5, 5.8, 25);
    ctx.quadraticCurveTo(5, 13, 12, 13);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(236, 254, 255, ${Math.min(1, this.profile.alpha + 0.12)})`;
    this.fillRoundedRect(ctx, 8.2, 18, 7.5, 12.8, 3, `rgba(236, 254, 255, ${Math.min(1, this.profile.alpha + 0.12)})`);
    this.drawLimb(ctx, 7.8, 21, 3.6, 28, 5.5 - stride * 0.4, 35, `rgba(103, 232, 249, ${this.profile.alpha})`, 3.2);
    this.drawLimb(ctx, 16.2, 21, 20.4, 28, 18.5 + stride * 0.4, 35, `rgba(103, 232, 249, ${this.profile.alpha})`, 3.2);

    this.drawHumanHead(ctx, {
      faceColor: `rgba(236, 254, 255, ${Math.min(1, this.profile.alpha + 0.14)})`,
      hairColor: `rgba(103, 232, 249, ${this.profile.alpha})`,
      eyeColor: "rgba(15, 23, 42, 0.34)",
      glowColor: `rgba(${this.profile.auraColor}, 0.4)`
    });

    ctx.fillStyle = "rgba(15, 23, 42, 0.28)";
    ctx.beginPath();
    ctx.arc(this.width / 2 - 2, 8.4, 1.05, 0, Math.PI * 2);
    ctx.arc(this.width / 2 + 2, 8.4, 1.05, 0, Math.PI * 2);
    ctx.fill();
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
    ctx.rotate(this.fallTilt);
    ctx.translate(-this.width / 2, -this.height / 2);

    switch (this.profile.id) {
      case "ninja":
        this.drawNinja(ctx);
        break;
      case "heavy":
        this.drawHeavy(ctx);
        break;
      case "ghost":
        this.drawGhost(ctx);
        break;
      default:
        this.drawDefault(ctx);
        break;
    }

    ctx.restore();
  }
}

class StickHeroGame {
  constructor(canvas, ui) {

    this.ui = ui;

    this.config = {
      platformTop: 360,

      playerHeight: 54,
      playerOffset: 8,

      stickRotateSpeed: Math.PI * 2.25,
      playerWalkSpeed: 210,
      sceneShiftSpeed: 420,
      landingDuration: 0.28,
      landingBounceHeight: 18,
      slipperySlideDistance: 22,
      slipperySlideSpeed: 120,
      perfectTextDuration: 0.8,
      perfectFlashDuration: 0.45,
      perfectSlowMoDuration: 0.26,
      ghostCorrectionDuration: 0.45,
      backgroundTransitionDuration: 0.4,
      longStickZoomThreshold: 240,
      longStickZoomMax: 0.1,
      trailParticleLife: 0.35,
      gravity: 1600,
      rescueMargin: 42,
      bonusPowerScore: 2,

      maxDifficultyTier: 10,
      widthShrinkPerTier: 5,
      gapIncreasePerTier: 10,
      gapMaxIncreasePerTier: 16,
      perfectZoneShrinkPerTier: 1,
      baseMotionRange: 14,
      baseMotionSpeed: 26,
      motionRangePerTier: 1.5,
      motionSpeedPerTier: 3,
      movingRangeIncreasePerTier: 3,
      movingSpeedIncreasePerTier: 6,
      movingBonusRange: 18,
      movingBonusSpeed: 18,
      highScoreStorageKey: "stick-hero-high-score"
    };

    this.baseConfig = { ...this.config };
    this.distanceScale = 1;
    this.resizeFrame = 0;

    this.stick = new Stick();
    this.player = new Player(
      this.config.playerWidth,
      this.config.playerHeight
    );

    this.phase = "ready";
    this.outcome = null;
    this.score = 0;
    this.highScore = 0;
    this.clearedPlatforms = 0;
    this.comboCount = 0;
    this.comboMultiplier = 1;
    this.comboDisplayTimer = 0;
    this.walkTargetX = 0;
    this.shiftRemaining = 0;
    this.holdActive = false;

    this.ghostCorrectionUsed = false;
    this.ghostCorrectionTimer = 0;
    this.ghostCorrectionX = 0;
    this.timeScale = 1;
    this.slowMotionTimer = 0;
    this.landingTimer = 0;
    this.landingSlideRemaining = 0;
    this.perfectTextTimer = 0;
    this.perfectFlashTimer = 0;
    this.perfectFlashPlatform = null;
    this.shakeTimer = 0;
    this.shakeDuration = 0;
    this.shakeMagnitude = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.failDrift = 0;
    this.lastGeneratedType = "normal";

    this.backgroundTransitionTimer = 0;

    this.cameraTargetScale = 1;

    this.powerUpMessage = "";
    this.powerUpMessageTimer = 0;

    this.landingPlatformIndex = -1;

    this.activeCharacter = CHARACTERS.default;

    this.growOscillator = null;
    this.growGainNode = null;

    this.resizeCanvas(false);
    this.bindResize();
    this.dayClouds = this.createDayClouds();
    this.nightStars = this.createNightStars();
