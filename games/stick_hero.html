    requestAnimationFrame((time) => this.loop(time));
  }

  clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  getCanvasDisplaySize() {
    const parent = this.canvas.parentElement || this.canvas;
    const bounds = parent.getBoundingClientRect();
    const fallbackWidth = Number(this.canvas.getAttribute("width")) || 960;
    const fallbackHeight = Number(this.canvas.getAttribute("height")) || 540;

    return {
      width: Math.max(420, Math.round(bounds.width || fallbackWidth)),
      height: Math.max(260, Math.round(bounds.height || fallbackHeight))
    };
  }

  getResponsiveScale(width = this.canvas.width, height = this.canvas.height) {
    const fitScale = Math.min(width / 960, height / 540);
    return this.clamp(fitScale, 0.72, 1.32);
  }

  getDistanceScale(width = this.canvas.width, height = this.canvas.height) {
    const areaScale = Math.sqrt((width * height) / (960 * 540));
    return this.clamp(areaScale, 0.78, 1.42);
  }

  applyResponsiveConfig(width, height) {
    const base = this.baseConfig;
    const visualScale = this.getResponsiveScale(width, height);
    this.distanceScale = this.getDistanceScale(width, height);

    Object.assign(this.config, {
      platformTop: Math.round(
        this.clamp(height * 0.68, 178 * visualScale, height - 92 * visualScale)
      ),
      currentPlatformX: Math.round(
        this.clamp(width * 0.065, 56 * visualScale, 128 * visualScale)
      ),
      currentPlatformWidth: Math.round(
        this.clamp(width * 0.14, 118 * visualScale, 194 * visualScale)
      ),
      perfectZoneWidth: Math.round(this.clamp(base.perfectZoneWidth * visualScale, 10, 24)),
      playerWidth: Math.round(base.playerWidth * visualScale),
      playerHeight: Math.round(base.playerHeight * visualScale),
      playerOffset: Math.round(base.playerOffset * visualScale),
      stickGrowSpeed: base.stickGrowSpeed * visualScale,
      playerWalkSpeed: base.playerWalkSpeed * visualScale,
      sceneShiftSpeed: base.sceneShiftSpeed * visualScale,
      landingBounceHeight: base.landingBounceHeight * visualScale,
      slipperySlideDistance: base.slipperySlideDistance * visualScale,
      slipperySlideSpeed: base.slipperySlideSpeed * visualScale,
      rescueMargin: base.rescueMargin * visualScale,
      gravity: base.gravity * visualScale,
      baseMotionRange: base.baseMotionRange * this.distanceScale,
      baseMotionSpeed: base.baseMotionSpeed * visualScale,
      movingBonusRange: base.movingBonusRange * this.distanceScale,
      movingBonusSpeed: base.movingBonusSpeed * visualScale,
      motionRangePerTier: base.motionRangePerTier * this.distanceScale,
      motionSpeedPerTier: base.motionSpeedPerTier * visualScale,
      movingRangeIncreasePerTier: base.movingRangeIncreasePerTier * this.distanceScale,
      movingSpeedIncreasePerTier: base.movingSpeedIncreasePerTier * visualScale
    });

    if (this.player) {
      this.player.width = this.config.playerWidth;
      this.player.height = this.config.playerHeight;
    }
  }

  bindResize() {
    const scheduleResize = () => {
      if (this.resizeFrame) {
        return;
      }

      this.resizeFrame = requestAnimationFrame(() => {
        this.resizeFrame = 0;
        this.resizeCanvas(true);
      });
    };

    if (window.ResizeObserver) {
      this.resizeObserver = new ResizeObserver(scheduleResize);
      this.resizeObserver.observe(this.canvas.parentElement || this.canvas);
    }

    window.addEventListener("resize", scheduleResize);
    window.addEventListener("orientationchange", scheduleResize);
  }

  resizeCanvas(preserveScene) {
    const { width, height } = this.getCanvasDisplaySize();
    const oldWidth = this.canvas.width || width;
    const oldHeight = this.canvas.height || height;
    const oldPlatformTop = this.config.platformTop;

    if (oldWidth === width && oldHeight === height) {
      return false;
    }

    this.canvas.width = width;
    this.canvas.height = height;
    this.applyResponsiveConfig(width, height);
    this.dayClouds = this.createDayClouds();
    this.nightStars = this.createNightStars();
    this.neonBuildings = this.createNeonBuildings();

    if (preserveScene && this.currentPlatform) {
      this.reflowScene(oldWidth, oldHeight, oldPlatformTop);
    }

    return true;
  }

  reflowScene(oldWidth, oldHeight, oldPlatformTop) {
    const scaleX = oldWidth > 0 ? this.canvas.width / oldWidth : 1;
    const scaleY = oldHeight > 0 ? this.canvas.height / oldHeight : 1;
    const platformTop = this.config.platformTop;
    const platforms = [
      this.currentPlatform,
      this.targetPlatform,
      ...(Array.isArray(this.upcomingPlatforms) ? this.upcomingPlatforms : [])
    ].filter(Boolean);

    platforms.forEach((platform) => {
      platform.x *= scaleX;
      platform.width = Math.max(42 * this.distanceScale, platform.width * scaleX);
      platform.motionBaseX *= scaleX;
      platform.motionRange *= scaleX;
      platform.motionSpeed *= this.getResponsiveScale();
      platform.topY = platformTop;
      platform.height = this.canvas.height - platformTop;
      platform.perfectZoneWidth = this.getPerfectZoneWidth();
    });

    if (this.player) {
      this.player.x *= scaleX;
      this.player.y =
        this.phase === "falling"
          ? this.player.y * scaleY
          : platformTop - this.player.height;
      this.walkTargetX *= scaleX;
      this.failDrift *= scaleX;
    }

    if (this.stick) {
      this.stick.baseX *= scaleX;
      this.stick.baseY = platformTop;
      this.stick.length *= scaleX;
    }

    this.shiftRemaining *= scaleX;
    this.ghostCorrectionX *= scaleX;
    this.stickTrail.forEach((particle) => {
      particle.x *= scaleX;
      particle.y =
        oldPlatformTop > 0
          ? platformTop + (particle.y - oldPlatformTop) * scaleY
          : particle.y * scaleY;
      particle.vx *= scaleX;
      particle.vy *= scaleY;
    });
  }

  bindInput() {
    this.canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      this.canvas.setPointerCapture?.(event.pointerId);
      this.handlePress();
    });

    window.addEventListener("pointerup", () => {
      this.handleRelease();
    });

    window.addEventListener("pointercancel", () => {
      this.handleRelease();
    });

    window.addEventListener("keydown", (event) => {
      if (event.code !== "Space" || event.repeat) {
        return;
      }

      event.preventDefault();
      this.handlePress();
    });

    window.addEventListener("keyup", (event) => {
      if (event.code !== "Space") {
        return;
      }

      event.preventDefault();
      this.handleRelease();
    });

    window.addEventListener("blur", () => {
      this.handleRelease();
    });

    this.ui.startButton.addEventListener("click", () => {
      this.startSelectedCharacter();
    });

    this.ui.restartButton.addEventListener("click", () => {
      this.resetGame();
    });

    this.ui.gameOverOverlay.addEventListener("pointerdown", (event) => {
      if (event.target.id === "restartButton") {
        return;
      }

      event.preventDefault();
      this.quickRestart(false);
    });
  }

  renderCharacterOptions() {
    this.ui.characterGrid.innerHTML = "";

    Object.values(CHARACTERS).forEach((profile) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "character-option";
      button.dataset.character = profile.id;
      button.style.setProperty("--card-accent", profile.accentColor);
      button.innerHTML = `
        <div class="character-name-row">
          <p class="character-name">${profile.name}</p>
          <span class="character-badge">${profile.badge}</span>
        </div>
        <p class="character-ability">${profile.description}</p>
        <p class="character-style">${profile.styleText}</p>
      `;

      button.addEventListener("click", () => {
        this.selectCharacter(profile.id);
      });

      this.ui.characterGrid.appendChild(button);
    });
  }

  selectCharacter(characterId) {
    this.selectedCharacterId = characterId;
    this.activeCharacter = CHARACTERS[characterId] ?? CHARACTERS.default;
    this.player.setCharacter(this.activeCharacter);
    this.stick.setCharacter(this.activeCharacter);
    this.backgroundThemeIndex = this.getThemeIndex(this.activeCharacter.startingTheme);

    this.ui.characterDescription.textContent = `${this.activeCharacter.name}: ${this.activeCharacter.description}`;

    this.ui.characterGrid.querySelectorAll(".character-option").forEach((button) => {
      button.dataset.selected = String(button.dataset.character === characterId);
    });
  }

  startSelectedCharacter() {
    this.selectionOpen = false;
    this.ui.selectionOverlay.hidden = true;
    this.resetGame();
  }

  showSelectionScreen() {
    this.selectionOpen = true;
    this.ui.selectionOverlay.hidden = false;
  }

  getThemeIndex(themeKey) {
    const index = BACKGROUND_THEMES.indexOf(themeKey);
    return index >= 0 ? index : 0;
  }

  get currentThemeKey() {
    return BACKGROUND_THEMES[this.backgroundThemeIndex];
  }

  cycleBackgroundTheme() {
    this.backgroundTransitionFrom = this.currentThemeKey;
    this.backgroundThemeIndex = (this.backgroundThemeIndex + 1) % BACKGROUND_THEMES.length;
    this.backgroundTransitionTimer = this.config.backgroundTransitionDuration;
  }

  randomBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  loadHighScore() {
    try {
      const storedValue = window.localStorage.getItem(this.config.highScoreStorageKey);
      const parsedValue = Number(storedValue);
      return Number.isFinite(parsedValue) ? Math.max(0, parsedValue) : 0;
    } catch {
      return 0;
    }
  }

  saveHighScore() {
    try {
      window.localStorage.setItem(
        this.config.highScoreStorageKey,
        String(this.highScore)
      );
    } catch {}
  }

  syncHighScore() {
    if (this.score <= this.highScore) {
      return;
    }

    this.highScore = this.score;
    this.saveHighScore();
  }

  addScore(points) {
    this.score += points;
    this.syncHighScore();
  }

  getDifficultyTier() {
    return Math.min(
      this.config.maxDifficultyTier,
      Math.floor(this.clearedPlatforms / this.config.difficultyTierSize)
    );
  }

  getPerfectZoneWidth() {
    const tier = this.getDifficultyTier();
    return Math.max(
      10,
      this.config.perfectZoneWidth - tier * this.config.perfectZoneShrinkPerTier
    );
  }

  getMotionProfile(type) {
    const tier = this.getDifficultyTier();
    let motionRange =
      this.config.baseMotionRange + tier * this.config.motionRangePerTier;
    let motionSpeed =
      this.config.baseMotionSpeed + tier * this.config.motionSpeedPerTier + Math.random() * 8;

    if (type === "moving") {
      motionRange +=
        this.config.movingBonusRange + tier * this.config.movingRangeIncreasePerTier;
      motionSpeed +=
        this.config.movingBonusSpeed + tier * this.config.movingSpeedIncreasePerTier;
    }

    return {
      motionRange,
      motionSpeed
    };
  }

  getReachablePlatforms() {
    return [this.targetPlatform, ...this.upcomingPlatforms];
  }

  findLandingPlatform(landingX) {
    const platforms = this.getReachablePlatforms();
    const index = platforms.findIndex(
      (platform) => landingX >= platform.x && landingX <= platform.right
    );

    if (index < 0) {
      return null;
    }

    return {
      platform: platforms[index],
      index
    };
  }

  findCorrectionCandidate(landingX, margin, edgePadding) {
    let bestMatch = null;

    this.getReachablePlatforms().forEach((platform, index) => {
      let missDistance = Infinity;
      let correctedX = null;

      if (landingX < platform.x) {
        missDistance = platform.x - landingX;
        correctedX = platform.x + edgePadding;
      } else if (landingX > platform.right) {
        missDistance = landingX - platform.right;
        correctedX = platform.right - edgePadding;
      }

      if (
        correctedX === null ||
        missDistance > margin ||
        (bestMatch && missDistance >= bestMatch.missDistance)
      ) {
        return;
      }

      bestMatch = {
        platform,
        index,
        missDistance,
        correctedX
      };
    });

    return bestMatch;
  }

  setPowerUpMessage(message) {
    this.powerUpMessage = message;
    this.powerUpMessageTimer = 1.2;
  }

  clearActivePowerUp(message = "") {
    this.activePowerUp = null;
    if (message) {
      this.setPowerUpMessage(message);
    }
  }

  ensureAudioContext() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) {
      return;
    }

    if (!this.audioContext) {
      this.audioContext = new AudioContextClass();
    }

    if (this.audioContext.state === "suspended") {
      this.audioContext.resume().catch(() => {});
    }
  }

  playPerfectSound() {
    if (!this.audioContext) {
      return;
    }

    const now = this.audioContext.currentTime;
    const tones = [
      { type: "triangle", from: 880, to: 1175, delay: 0, duration: 0.14, gain: 0.05 },
      { type: "sine", from: 1320, to: 1760, delay: 0.05, duration: 0.16, gain: 0.03 }
    ];

    tones.forEach((tone) => {
      const oscillator = this.audioContext.createOscillator();
      const gainNode = this.audioContext.createGain();
      const startTime = now + tone.delay;
      const endTime = startTime + tone.duration;

      oscillator.type = tone.type;
      oscillator.frequency.setValueAtTime(tone.from, startTime);
      oscillator.frequency.exponentialRampToValueAtTime(tone.to, endTime);

      gainNode.gain.setValueAtTime(0.0001, startTime);
      gainNode.gain.exponentialRampToValueAtTime(tone.gain, startTime + 0.015);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, endTime);

      oscillator.connect(gainNode);
      gainNode.connect(this.audioContext.destination);

      oscillator.start(startTime);
      oscillator.stop(endTime);
    });
  }

  playLandingSound() {
    if (!this.audioContext) {
      return;
    }

    const now = this.audioContext.currentTime;
    const oscillator = this.audioContext.createOscillator();
    const gainNode = this.audioContext.createGain();

    oscillator.type = "triangle";
    oscillator.frequency.setValueAtTime(240, now);
    oscillator.frequency.exponentialRampToValueAtTime(132, now + 0.12);

    gainNode.gain.setValueAtTime(0.0001, now);
    gainNode.gain.exponentialRampToValueAtTime(0.05, now + 0.01);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);

    oscillator.connect(gainNode);
    gainNode.connect(this.audioContext.destination);
    oscillator.start(now);
    oscillator.stop(now + 0.14);
  }

  startGrowSound() {
    if (!this.audioContext || this.growOscillator) {
      return;
    }

    const oscillator = this.audioContext.createOscillator();
    const gainNode = this.audioContext.createGain();
    const now = this.audioContext.currentTime;

    oscillator.type = "sawtooth";
    oscillator.frequency.setValueAtTime(160, now);
    gainNode.gain.setValueAtTime(0.0001, now);
    gainNode.gain.exponentialRampToValueAtTime(0.018, now + 0.04);

    oscillator.connect(gainNode);
    gainNode.connect(this.audioContext.destination);
    oscillator.start(now);

    oscillator.onended = () => {
      if (this.growOscillator === oscillator) {
        this.growOscillator = null;
        this.growGainNode = null;
      }
    };

    this.growOscillator = oscillator;
    this.growGainNode = gainNode;
  }

  updateGrowSound() {
    if (!this.growOscillator || !this.growGainNode || !this.audioContext) {
      return;
    }

    const now = this.audioContext.currentTime;
    const normalizedLength = Math.min(1, this.stick.length / 320);
    const frequency = 160 + normalizedLength * 180;
    const gain = 0.012 + normalizedLength * 0.018;

    this.growOscillator.frequency.cancelScheduledValues(now);
    this.growOscillator.frequency.linearRampToValueAtTime(frequency, now + 0.05);
    this.growGainNode.gain.cancelScheduledValues(now);
    this.growGainNode.gain.linearRampToValueAtTime(gain, now + 0.05);
  }

  stopGrowSound() {
    if (!this.growOscillator || !this.growGainNode || !this.audioContext) {
      return;
    }

    const oscillator = this.growOscillator;
    const gainNode = this.growGainNode;
    const now = this.audioContext.currentTime;
    this.growOscillator = null;
    this.growGainNode = null;

    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(Math.max(0.0001, gainNode.gain.value), now);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
    oscillator.stop(now + 0.06);
  }

  hideGameOverOverlay() {
    this.ui.gameOverOverlay.hidden = true;
  }

  showGameOverOverlay() {
    this.syncHighScore();
    this.ui.finalScoreLabel.textContent = String(this.score);
    this.ui.bestScoreLabel.textContent = String(this.highScore);
    this.ui.gameOverOverlay.hidden = false;
  }

  createPlatform(x, width, type = "normal", options = {}) {
    return new Platform({
      x,
      width,
      topY: this.config.platformTop,
      canvasHeight: this.canvas.height,
      perfectZoneWidth: options.perfectZoneWidth ?? this.config.perfectZoneWidth,
      type,
      motionRange: options.motionRange,
      motionSpeed: options.motionSpeed
    });
  }

  choosePlatformType() {
    const cleared = this.clearedPlatforms;
    const roll = Math.random();
    let type = "normal";

    if (cleared < 2) {
      type = "normal";
    } else if (cleared < 5) {
      type = roll < 0.68 ? "normal" : roll < 0.88 ? "slippery" : "moving";
    } else if (cleared < 8) {
      if (roll < 0.46) {
        type = "normal";
      } else if (roll < 0.68) {
        type = "moving";
      } else if (roll < 0.86) {
        type = "slippery";
      } else {
        type = "breakable";
      }
    } else if (roll < 0.34) {
      type = "normal";
    } else if (roll < 0.56) {
      type = "moving";
    } else if (roll < 0.78) {
      type = "slippery";
    } else {
      type = "breakable";
    }

    if (cleared < 6 && type === this.lastGeneratedType && type !== "normal") {
      type = type === "moving" ? "slippery" : "normal";
    }

    this.lastGeneratedType = type;
    return type;
  }

  getGenerationProfile(type) {
    const tier = this.getDifficultyTier();
    const scale = this.distanceScale || 1;
    const profiles = {
      normal: { widthMin: 90 * scale, widthMax: 180 * scale, gapMin: 120 * scale, gapMax: 300 * scale },
      moving: { widthMin: 120 * scale, widthMax: 195 * scale, gapMin: 100 * scale, gapMax: 240 * scale },
      breakable: { widthMin: 110 * scale, widthMax: 185 * scale, gapMin: 110 * scale, gapMax: 270 * scale },
      slippery: { widthMin: 105 * scale, widthMax: 190 * scale, gapMin: 110 * scale, gapMax: 270 * scale }
    };

    const baseProfile = profiles[type] ?? profiles.normal;
    const widthMin = Math.max(72, baseProfile.widthMin - tier * this.config.widthShrinkPerTier);
    const widthMax = Math.max(
      widthMin + 18,
      baseProfile.widthMax - tier * (this.config.widthShrinkPerTier + 1)
    );

    return {
      widthMin,
      widthMax,
      gapMin: baseProfile.gapMin + tier * this.config.gapIncreasePerTier,
      gapMax: baseProfile.gapMax + tier * this.config.gapMaxIncreasePerTier
    };
  }

  choosePowerUpType(platformType) {
    if (this.activePowerUp || this.clearedPlatforms < 2) {
      return null;
    }

    if (platformType === "breakable" && this.clearedPlatforms < 5) {
      return null;
    }

    const chance = Math.min(
      0.38,
      this.config.powerUpSpawnChance + this.getDifficultyTier() * 0.02
    );

    if (Math.random() > chance) {
      return null;
    }

    return Math.random() < 0.52 ? "rescue" : "bonus";
  }

  createTargetPlatform(fromPlatform) {
    const type = this.choosePlatformType();
    const profile = this.getGenerationProfile(type);
    const width = this.randomBetween(profile.widthMin, profile.widthMax);
    const motionProfile = this.getMotionProfile(type);
    const movementPadding = motionProfile.motionRange + 10;
    const availableGapMax =
      this.canvas.width - fromPlatform.right - width - movementPadding - 70;
    const gapMax = Math.max(
      profile.gapMin + 24,
      Math.min(profile.gapMax, availableGapMax)
    );
    const gap = this.randomBetween(profile.gapMin, gapMax);
    const x = fromPlatform.right + gap;
    const platform = this.createPlatform(x, width, type, {
      perfectZoneWidth: this.getPerfectZoneWidth(),
      motionRange: motionProfile.motionRange,
      motionSpeed: motionProfile.motionSpeed
    });
    const powerUpType = this.choosePowerUpType(type);

    if (powerUpType) {
      platform.setPowerUp(powerUpType);
    }

    return platform;
  }

  fillUpcomingPlatforms() {
    while (this.upcomingPlatforms.length < this.config.extraPlatformCount) {
      const fromPlatform =
        this.upcomingPlatforms.length > 0
          ? this.upcomingPlatforms[this.upcomingPlatforms.length - 1]
          : this.targetPlatform;

      this.upcomingPlatforms.push(this.createTargetPlatform(fromPlatform));
    }
  }

  quickRestart(startGrowing = true) {
    this.resetGame();

    if (startGrowing) {
      this.ensureAudioContext();
      this.holdActive = true;
      this.phase = "growing";
      this.startGrowSound();
    }
  }

  resetGame() {
    const {
      currentPlatformX,
      currentPlatformWidth,
      platformTop,
      playerWidth,
      playerHeight,
      playerOffset
    } = this.config;

    this.player.width = playerWidth;
    this.player.height = playerHeight;
    this.player.setCharacter(this.activeCharacter);
    this.stick.setCharacter(this.activeCharacter);
    this.stopGrowSound();
    this.backgroundThemeIndex = this.getThemeIndex(this.activeCharacter.startingTheme);
    this.backgroundTransitionFrom = null;
    this.backgroundTransitionTimer = 0;
    this.cameraScale = 1;
    this.cameraTargetScale = 1;
    this.score = 0;
    this.clearedPlatforms = 0;
    this.comboCount = 0;
    this.comboMultiplier = 1;
    this.comboDisplayTimer = 0;
    this.activePowerUp = null;
    this.powerUpMessage = "";
    this.powerUpMessageTimer = 0;
    this.landingPlatform = null;
    this.landingPlatformIndex = -1;
    this.lastGeneratedType = "normal";
    this.currentPlatform = this.createPlatform(
      currentPlatformX,
      currentPlatformWidth,
      "normal",
      {
        perfectZoneWidth: this.getPerfectZoneWidth(),
        ...this.getMotionProfile("normal")
      }
    );
    this.targetPlatform = this.createTargetPlatform(this.currentPlatform);
    this.upcomingPlatforms = [];
    this.fillUpcomingPlatforms();
    this.stick.reset(this.currentPlatform.right, platformTop);
    this.player.reset(
      this.currentPlatform.right - playerWidth - playerOffset,
      platformTop - playerHeight
    );

    this.phase = "ready";
    this.outcome = null;
    this.walkTargetX = this.player.x;
    this.shiftRemaining = 0;
    this.holdActive = false;
    this.isPerfectLanding = false;
    this.ghostCorrectionUsed = false;
    this.ghostCorrectionTimer = 0;
    this.ghostCorrectionX = 0;
    this.timeScale = 1;
    this.slowMotionTimer = 0;
    this.landingTimer = 0;
    this.landingSlideRemaining = 0;
    this.perfectTextTimer = 0;
    this.perfectFlashTimer = 0;
    this.perfectFlashPlatform = null;
    this.shakeTimer = 0;
    this.shakeDuration = 0;
    this.shakeMagnitude = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.failDrift = 0;
    this.stickTrail = [];
    this.trailSpawnTimer = 0;
    this.hideGameOverOverlay();
    this.ui.bestScoreLabel.textContent = String(this.highScore);
  }

  handlePress() {
    if (this.selectionOpen) {
      return;
    }

    this.ensureAudioContext();

    if (this.phase === "ready") {
      this.holdActive = true;
      this.phase = "growing";
      this.startGrowSound();
      return;
    }

    if (this.phase === "falling" || this.phase === "ended") {
      this.quickRestart(true);
    }
  }

  handleRelease() {
    if (this.selectionOpen || !this.holdActive) {
      return;
    }

    this.holdActive = false;
    this.stopGrowSound();

    if (this.phase === "growing") {
      this.phase = "rotating";
    }
  }

  emitStickTrail(deltaTime) {
    this.trailSpawnTimer += deltaTime;

    while (this.trailSpawnTimer >= 0.018) {
      this.trailSpawnTimer -= 0.018;

      this.stickTrail.push({
        x: this.stick.tipX + this.randomBetween(-6, 6),
        y: this.stick.tipY + this.randomBetween(-6, 6),
        vx: this.randomBetween(-12, 12),
        vy: this.randomBetween(-22, -6),
        radius: this.randomBetween(3, 6),
        life: this.config.trailParticleLife,
        maxLife: this.config.trailParticleLife
      });
    }
  }

  updateStickTrail(deltaTime) {
    this.stickTrail = this.stickTrail.filter((particle) => particle.life > 0);

    this.stickTrail.forEach((particle) => {
      particle.life -= deltaTime;
      particle.x += particle.vx * deltaTime;
      particle.y += particle.vy * deltaTime;
      particle.radius = Math.max(0.2, particle.radius - deltaTime * 6);
    });
  }

  evaluateStick() {
    let landingX = this.stick.baseX + this.stick.length;
    let landingResult = this.findLandingPlatform(landingX);
    let success = Boolean(landingResult);

    if (!success && this.activeCharacter.correctionMargin > 0) {
      const correction = this.findCorrectionCandidate(
        landingX,
        this.activeCharacter.correctionMargin,
        2
      );

      if (correction) {
        landingX = correction.correctedX;
        landingResult = {
          platform: correction.platform,
          index: correction.index
        };
        success = true;
        this.stick.length = landingX - this.stick.baseX;
        this.ghostCorrectionUsed = true;
        this.ghostCorrectionTimer = this.config.ghostCorrectionDuration;
        this.ghostCorrectionX = landingX;
      }
    }

    if (!success && this.activePowerUp?.type === "rescue") {
      const correction = this.findCorrectionCandidate(
        landingX,
        this.config.rescueMargin,
        4
      );

      if (correction) {
        landingX = correction.correctedX;
        landingResult = {
          platform: correction.platform,
          index: correction.index
        };
        success = true;
        this.stick.length = landingX - this.stick.baseX;
        this.clearActivePowerUp("Rescue save!");
      }
    }

    this.landingPlatform = landingResult?.platform ?? null;
    this.landingPlatformIndex = landingResult?.index ?? -1;
    this.outcome = success ? "success" : "failure";
    this.isPerfectLanding =
      success &&
      landingX >= this.landingPlatform.perfectZoneLeft &&
      landingX <= this.landingPlatform.perfectZoneRight;

    if (success) {
      this.walkTargetX = Math.max(
        this.landingPlatform.x + 2,
        Math.min(
          this.landingPlatform.right - this.player.width - this.config.playerOffset,
          landingX - this.player.width / 2 + this.config.playerOffset
        )
      );
    } else {
      this.walkTargetX = landingX - this.player.width / 2;
    }
  }

  resetCombo() {
    this.comboCount = 0;
    this.comboMultiplier = 1;
    this.comboDisplayTimer = 0;
  }

  collectPlatformPowerUp() {
    if (!this.landingPlatform?.powerUp) {
      return;
    }

    this.activePowerUp = { ...this.landingPlatform.powerUp };
    this.landingPlatform.clearPowerUp();
    this.setPowerUpMessage(`${this.activePowerUp.label} ready`);
  }

  applyActivePowerUpReward() {
    if (!this.activePowerUp || this.activePowerUp.type !== "bonus") {
      return;
    }

    this.addScore(this.config.bonusPowerScore);
    this.clearActivePowerUp(`Boost +${this.config.bonusPowerScore}!`);
  }

  updatePlatforms(deltaTime) {
    const isInteractivePhase =
      this.phase === "ready" ||
      this.phase === "growing" ||
      this.phase === "rotating";

    this.currentPlatform.update(deltaTime, isInteractivePhase);
    this.targetPlatform.update(deltaTime, isInteractivePhase);
    this.currentPlatform.updateCrumble(deltaTime);
    this.targetPlatform.updateCrumble(deltaTime);
    this.upcomingPlatforms.forEach((platform) => {
      platform.update(deltaTime, isInteractivePhase);
      platform.updateCrumble(deltaTime);
    });

    if (isInteractivePhase) {
      this.player.x =
        this.currentPlatform.right - this.player.width - this.config.playerOffset;
      this.player.y = this.config.platformTop - this.player.height;
      this.player.fallTilt = 0;
      this.stick.baseX = this.currentPlatform.right;
      this.stick.baseY = this.config.platformTop;
    }
  }

  shiftScene(distance) {
    this.currentPlatform.shift(distance);
    this.targetPlatform.shift(distance);
    this.upcomingPlatforms.forEach((platform) => {
      platform.shift(distance);
    });
    this.player.x -= distance;
    this.stick.baseX -= distance;
    this.stickTrail.forEach((particle) => {
      particle.x -= distance;
    });
    this.ghostCorrectionX -= distance;
  }

  triggerScreenShake(magnitude, duration) {
    this.shakeMagnitude = magnitude;
    this.shakeDuration = duration;
    this.shakeTimer = duration;
  }

  triggerPerfectReward() {
    this.comboCount += 1;
    this.comboMultiplier = Math.max(1, this.comboCount);
    this.addScore(this.config.perfectBonus * this.comboMultiplier);
    this.perfectTextTimer = this.config.perfectTextDuration;
    this.perfectFlashTimer = this.config.perfectFlashDuration;
    this.perfectFlashPlatform = this.landingPlatform;
    this.slowMotionTimer = this.config.perfectSlowMoDuration;
    this.comboDisplayTimer = this.config.comboDisplayDuration;
    this.playPerfectSound();
  }

  startLandingSequence() {
    this.phase = "landing";
    this.player.y = this.config.platformTop - this.player.height;
    this.player.vy = 0;
    this.player.fallTilt = 0;
    this.landingTimer = this.config.landingDuration;
    this.landingSlideRemaining =
      this.landingPlatform?.type === "slippery"
        ? this.config.slipperySlideDistance * this.activeCharacter.slideMultiplier
        : 0;

    this.landingPlatform?.registerLanding();
    this.addScore(1);
    this.clearedPlatforms += 1;
    this.playLandingSound();

    if (this.isPerfectLanding) {
      this.triggerPerfectReward();
    } else {
      this.resetCombo();
    }

    this.applyActivePowerUpReward();
    this.collectPlatformPowerUp();
  }

  startFailureSequence() {
    this.phase = "falling";
    this.player.vy = 120;
    this.failDrift = 54;
    this.resetCombo();
    this.triggerScreenShake(12, 0.34);
  }

  beginSceneShift() {
    if (this.currentPlatform.type === "breakable" && this.currentPlatform.hasBeenLandedOn) {
      this.currentPlatform.startCrumble();
    }

    this.shiftRemaining =
      (this.landingPlatform?.x ?? this.targetPlatform.x) - this.config.currentPlatformX;
    this.phase = "shifting";
  }

  finishSceneShift() {
    const {
      currentPlatformX,
      platformTop,
      playerWidth,
      playerHeight,
      playerOffset
    } = this.config;

    const remainingPlatforms = this.getReachablePlatforms().slice(
      this.landingPlatformIndex + 1
    );

    this.currentPlatform = this.landingPlatform ?? this.targetPlatform;
    this.currentPlatform.setX(currentPlatformX, true);
    this.targetPlatform =
      remainingPlatforms.shift() ?? this.createTargetPlatform(this.currentPlatform);
    this.upcomingPlatforms = remainingPlatforms;
    this.fillUpcomingPlatforms();
    this.stick.reset(this.currentPlatform.right, platformTop);
    this.player.reset(
      this.currentPlatform.right - playerWidth - playerOffset,
      platformTop - playerHeight
    );

    this.outcome = null;
    this.walkTargetX = this.player.x;
    this.shiftRemaining = 0;
    this.isPerfectLanding = false;
    this.landingPlatform = null;
    this.landingPlatformIndex = -1;
    this.ghostCorrectionUsed = false;
    this.ghostCorrectionTimer = 0;
    this.landingTimer = 0;
    this.landingSlideRemaining = 0;
    this.phase = "ready";
    this.cycleBackgroundTheme();
  }

  startGameOver() {
    this.phase = "ended";
    this.holdActive = false;
    this.stopGrowSound();
    this.showGameOverOverlay();
  }

  updateEffects(unscaledDeltaTime) {
    if (this.phase === "growing") {
      this.emitStickTrail(unscaledDeltaTime);
      this.updateGrowSound();
    } else {
      this.trailSpawnTimer = 0;
    }

    this.updateStickTrail(unscaledDeltaTime);

    if (this.slowMotionTimer > 0) {
      this.slowMotionTimer = Math.max(0, this.slowMotionTimer - unscaledDeltaTime);
    }

    const targetTimeScale = this.slowMotionTimer > 0 ? 0.38 : 1;
    this.timeScale += (targetTimeScale - this.timeScale) * Math.min(1, unscaledDeltaTime * 10);

    if (this.perfectTextTimer > 0) {
      this.perfectTextTimer = Math.max(0, this.perfectTextTimer - unscaledDeltaTime);
      if (this.perfectTextTimer === 0 && this.perfectFlashTimer === 0) {
        this.perfectFlashPlatform = null;
      }
    }

    if (this.perfectFlashTimer > 0) {
      this.perfectFlashTimer = Math.max(0, this.perfectFlashTimer - unscaledDeltaTime);
      if (this.perfectFlashTimer === 0 && this.perfectTextTimer === 0) {
        this.perfectFlashPlatform = null;
      }
    }

    if (this.ghostCorrectionTimer > 0) {
      this.ghostCorrectionTimer = Math.max(0, this.ghostCorrectionTimer - unscaledDeltaTime);
    }

    if (this.comboDisplayTimer > 0) {
      this.comboDisplayTimer = Math.max(0, this.comboDisplayTimer - unscaledDeltaTime);
    }

    if (this.powerUpMessageTimer > 0) {
      this.powerUpMessageTimer = Math.max(0, this.powerUpMessageTimer - unscaledDeltaTime);
      if (this.powerUpMessageTimer === 0) {
        this.powerUpMessage = "";
      }
    }

    if (this.backgroundTransitionTimer > 0) {
      this.backgroundTransitionTimer = Math.max(0, this.backgroundTransitionTimer - unscaledDeltaTime);
      if (this.backgroundTransitionTimer === 0) {
        this.backgroundTransitionFrom = null;
      }
    }

    if (this.shakeTimer > 0) {
      this.shakeTimer = Math.max(0, this.shakeTimer - unscaledDeltaTime);
      const strength = (this.shakeTimer / this.shakeDuration) * this.shakeMagnitude;
      this.shakeX = (Math.random() * 2 - 1) * strength;
      this.shakeY = (Math.random() * 2 - 1) * strength * 0.65;
    } else {
      this.shakeX = 0;
      this.shakeY = 0;
    }

    let targetScale = 1;
    if (
      this.phase === "growing" ||
      this.phase === "rotating" ||
      this.phase === "walking" ||
      this.phase === "landing"
    ) {
      const excessLength = Math.max(0, this.stick.length - this.config.longStickZoomThreshold);
      const zoomAmount = Math.min(
        this.config.longStickZoomMax,
        excessLength / 1600
      );
      targetScale = 1 - zoomAmount;
    }

    this.cameraTargetScale = targetScale;
    this.cameraScale += (this.cameraTargetScale - this.cameraScale) * Math.min(1, unscaledDeltaTime * 6);
  }

  update(deltaTime) {
    if (this.selectionOpen) {
      return;
    }

    this.updatePlatforms(deltaTime);

    switch (this.phase) {
      case "growing":
        this.stick.length +=
          this.config.stickGrowSpeed * this.activeCharacter.growSpeedMultiplier * deltaTime;
        break;

      case "rotating":
        this.stick.angle += this.config.stickRotateSpeed * deltaTime;
        if (this.stick.angle >= 0) {
          this.stick.angle = 0;
          this.evaluateStick();
          this.phase = "walking";
        }
        break;

      case "walking":
        this.player.x += this.config.playerWalkSpeed * deltaTime;
        if (this.player.x >= this.walkTargetX) {
          this.player.x = this.walkTargetX;

          if (this.outcome === "success") {
            this.startLandingSequence();
          } else {
            this.startFailureSequence();
          }
        }
        break;

      case "landing": {
        this.landingTimer = Math.max(0, this.landingTimer - deltaTime);
        const progress = 1 - this.landingTimer / this.config.landingDuration;
        const bounceHeight =
          this.config.landingBounceHeight *
          this.activeCharacter.landingBounceMultiplier *
          (this.isPerfectLanding ? 1.44 : 1);

        this.player.y =
          this.config.platformTop -
          this.player.height -
          Math.sin(progress * Math.PI) * bounceHeight;

        if (this.landingSlideRemaining > 0) {
          const slideStep = Math.min(
            this.landingSlideRemaining,
            this.config.slipperySlideSpeed * deltaTime
          );
          const maxSlideX =
            (this.landingPlatform?.right ?? this.targetPlatform.right) -
            this.player.width -
            2;
          this.player.x = Math.min(maxSlideX, this.player.x + slideStep);
          this.landingSlideRemaining = Math.max(0, this.landingSlideRemaining - slideStep);
        }

        if (this.landingTimer <= 0) {
          this.player.y = this.config.platformTop - this.player.height;
          this.beginSceneShift();
        }
        break;
      }

      case "shifting": {
        const shiftStep = Math.min(
          this.shiftRemaining,
          this.config.sceneShiftSpeed * deltaTime
        );
        this.shiftScene(shiftStep);
        this.shiftRemaining -= shiftStep;

        if (this.shiftRemaining <= 0) {
          this.finishSceneShift();
        }
        break;
      }

      case "falling":
        this.player.vy += this.config.gravity * deltaTime;
        this.player.x += this.failDrift * deltaTime;
        this.player.y += this.player.vy * deltaTime;
        this.player.fallTilt = Math.min(this.player.fallTilt + deltaTime * 2.8, Math.PI / 2);

        if (this.player.y > this.canvas.height + 80) {
          this.startGameOver();
        }
        break;
    }
  }

  createDayClouds() {
    const width = this.canvas.width || 960;
    const height = this.canvas.height || 540;
    const skyHeight = Math.max(130, this.config.platformTop - 70);

    return [
      { x: width * 0.13, y: Math.min(skyHeight * 0.48, height * 0.24), width: width * 0.09, height: height * 0.048 },
      { x: width * 0.31, y: Math.min(skyHeight * 0.36, height * 0.2), width: width * 0.12, height: height * 0.055 },
      { x: width * 0.72, y: Math.min(skyHeight * 0.42, height * 0.22), width: width * 0.105, height: height * 0.052 }
    ];
  }

  createNightStars() {
    return Array.from({ length: 38 }, () => ({
      x: this.randomBetween(24, this.canvas.width - 24),
      y: this.randomBetween(18, Math.max(92, this.config.platformTop - 110)),
      size: this.randomBetween(1.2, 3.1) * this.getResponsiveScale(),
      alpha: this.randomBetween(0.35, 0.9)
    }));
  }

  createNeonBuildings() {
    const buildings = [];
    let cursor = 0;
    const baseY = Math.max(160, this.config.platformTop - 18);

    while (cursor < this.canvas.width + 40) {
      const width = this.randomBetween(54, 110) * this.distanceScale;
      const height = this.randomBetween(baseY * 0.24, baseY * 0.56);
      buildings.push({
        x: cursor,
        width,
        height,
        glow: Math.random() > 0.5 ? "#22d3ee" : "#f472b6"
      });
      cursor += width - this.randomBetween(6, 18);
    }

    return buildings;
  }

  drawDayBackground() {
    const { ctx, canvas } = this;
    const width = canvas.width;
    const height = canvas.height;
    const groundY = this.config.platformTop;

    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, "#dbeafe");
    sky.addColorStop(0.68, "#e0f2fe");
    sky.addColorStop(1, "#fde68a");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
    ctx.beginPath();
    ctx.arc(width * 0.15, groundY * 0.31, Math.min(width, height) * 0.085, 0, Math.PI * 2);
    ctx.fill();

    this.dayClouds.forEach((cloud) => {
      ctx.fillStyle = "rgba(255, 255, 255, 0.64)";
      ctx.beginPath();
      ctx.ellipse(cloud.x, cloud.y, cloud.width / 2, cloud.height / 2, 0, 0, Math.PI * 2);
      ctx.ellipse(cloud.x - 24, cloud.y + 6, cloud.width / 3.2, cloud.height / 2.2, 0, 0, Math.PI * 2);
      ctx.ellipse(cloud.x + 24, cloud.y + 5, cloud.width / 3.4, cloud.height / 2.1, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = "#bbf7d0";
    ctx.beginPath();
    ctx.moveTo(0, groundY - 32);
    ctx.quadraticCurveTo(width * 0.18, groundY - 78, width * 0.38, groundY - 30);
    ctx.quadraticCurveTo(width * 0.58, groundY + 14, width * 0.79, groundY - 44);
    ctx.quadraticCurveTo(width * 0.91, groundY - 62, width, groundY - 26);
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#86efac";
    ctx.fillRect(0, groundY, width, height - groundY);
  }

  drawThemeByKey(themeKey) {
    switch (themeKey) {
      case "night":
        this.drawNightBackground();
        break;
      case "neon":
        this.drawNeonBackground();
        break;
      default:
        this.drawDayBackground();
        break;
    }
  }

  drawNightBackground() {
    const { ctx, canvas } = this;
    const width = canvas.width;
    const height = canvas.height;
    const groundY = this.config.platformTop;

    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, "#020617");
    sky.addColorStop(0.58, "#172554");
    sky.addColorStop(1, "#1e293b");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    this.nightStars.forEach((star) => {
      ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = "rgba(226, 232, 240, 0.82)";
    ctx.beginPath();
    ctx.arc(width * 0.8, groundY * 0.27, Math.min(width, height) * 0.067, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#312e81";
    ctx.beginPath();
    ctx.moveTo(0, groundY - 24);
    ctx.quadraticCurveTo(width * 0.18, groundY - 76, width * 0.38, groundY - 22);
    ctx.quadraticCurveTo(width * 0.6, groundY + 28, width * 0.79, groundY - 40);
    ctx.quadraticCurveTo(width * 0.9, groundY - 58, width, groundY - 20);
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, groundY, width, height - groundY);
  }

  drawNeonBackground() {
    const { ctx, canvas } = this;
    const width = canvas.width;
    const height = canvas.height;
    const groundY = this.config.platformTop;

    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, "#020617");
    sky.addColorStop(0.52, "#1e1b4b");
    sky.addColorStop(1, "#312e81");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "rgba(56, 189, 248, 0.1)";
    ctx.beginPath();
    ctx.arc(width * 0.76, groundY * 0.26, Math.min(width, height) * 0.12, 0, Math.PI * 2);
    ctx.fill();

    this.neonBuildings.forEach((building) => {
      const baseY = groundY - 18;
      const topY = baseY - building.height;

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(building.x, topY, building.width, building.height);

      ctx.fillStyle = building.glow;
      for (let y = topY + 16; y < baseY - 10; y += 18) {
        for (let x = building.x + 10; x < building.x + building.width - 10; x += 16) {
          ctx.fillRect(x, y, 6, 9);
        }
      }
    });

    ctx.fillStyle = "#111827";
    ctx.fillRect(0, groundY, width, height - groundY);

    ctx.strokeStyle = "rgba(34, 211, 238, 0.18)";
    ctx.lineWidth = 1;
    for (let y = groundY + 12; y < height; y += 24 * this.getResponsiveScale()) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }
  }

  drawBackground() {
    const { ctx } = this;

    if (this.backgroundTransitionTimer > 0 && this.backgroundTransitionFrom) {
      const progress =
        1 - this.backgroundTransitionTimer / this.config.backgroundTransitionDuration;

      this.drawThemeByKey(this.backgroundTransitionFrom);
      ctx.save();
      ctx.globalAlpha = progress;
      this.drawThemeByKey(this.currentThemeKey);
      ctx.restore();
      return;
    }

    this.drawThemeByKey(this.currentThemeKey);
  }

  drawStickTrail() {
    const { ctx } = this;

    this.stickTrail.forEach((particle) => {
      const alpha = Math.max(0, particle.life / particle.maxLife);
      ctx.fillStyle = `rgba(${this.activeCharacter.trailColor}, ${alpha * 0.44})`;
      ctx.beginPath();
      ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  drawPlayerShadow() {
    const { ctx } = this;
    if (
      this.phase === "falling" &&
      this.player.y > this.config.platformTop - this.player.height + 18
    ) {
      return;
    }

    const baselineY = this.config.platformTop + 10;
    const hoverHeight = Math.max(0, this.config.platformTop - this.player.height - this.player.y);
    const scale = Math.max(0.45, 1 - hoverHeight / 90);

    ctx.save();
    ctx.fillStyle = `rgba(15, 23, 42, ${0.18 * scale})`;
    ctx.beginPath();
    ctx.ellipse(
      this.player.x + this.player.width / 2,
      baselineY,
      20 * scale,
      7 * scale,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();
    ctx.restore();
  }

  drawPerfectEffects() {
    const { ctx } = this;

    if (this.perfectFlashTimer > 0 && this.perfectFlashPlatform) {
      const progress = this.perfectFlashTimer / this.config.perfectFlashDuration;
      const radius = 28 + (1 - progress) * 48;
      const centerX = this.perfectFlashPlatform.center;
      const centerY = this.perfectFlashPlatform.topY - 10;
      const glow = ctx.createRadialGradient(centerX, centerY, 6, centerX, centerY, radius);

      glow.addColorStop(0, `rgba(254, 240, 138, ${0.42 * progress})`);
      glow.addColorStop(0.55, `rgba(253, 224, 71, ${0.18 * progress})`);
      glow.addColorStop(1, "rgba(253, 224, 71, 0)");

      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    if (this.perfectTextTimer > 0 && this.perfectFlashPlatform) {
      const progress = 1 - this.perfectTextTimer / this.config.perfectTextDuration;
      const alpha = Math.min(1, this.perfectTextTimer / 0.28);
      const textY = this.perfectFlashPlatform.topY - 48 - progress * 28;
      const perfectLabel =
        this.comboMultiplier > 1 ? `PERFECT x${this.comboMultiplier}!` : "PERFECT!";

      ctx.save();
      ctx.textAlign = "center";
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.strokeStyle = `rgba(15, 23, 42, ${alpha * 0.6})`;
      ctx.lineWidth = 6;
      ctx.font = this.comboMultiplier > 1 ? "900 44px Segoe UI" : "900 54px Segoe UI";
      ctx.strokeText(perfectLabel, this.perfectFlashPlatform.center, textY);
      ctx.fillText(perfectLabel, this.perfectFlashPlatform.center, textY);
      ctx.restore();
    }
  }

  drawGhostCorrectionEffect() {
    const { ctx } = this;
    if (this.ghostCorrectionTimer <= 0) {
      return;
    }

    const progress = 1 - this.ghostCorrectionTimer / this.config.ghostCorrectionDuration;
    const radius = 8 + progress * 28;
    const alpha = this.ghostCorrectionTimer / this.config.ghostCorrectionDuration;

    ctx.save();
    ctx.strokeStyle = `rgba(34, 211, 238, ${alpha * 0.82})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(this.ghostCorrectionX, this.config.platformTop - 10, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  drawHud() {
    const { ctx, canvas } = this;
    const difficultyTier = this.getDifficultyTier();
    const inset = this.clamp(canvas.width * 0.022, 14, 28);
    const fontSize = Math.round(this.clamp(Math.min(canvas.width, canvas.height) * 0.034, 14, 20));
    const smallFontSize = Math.round(this.clamp(fontSize * 0.92, 13, 18));
    const pillHeight = Math.round(this.clamp(fontSize * 1.95, 28, 38));
    const rowGap = Math.round(this.clamp(fontSize * 0.45, 6, 10));
    const padX = Math.round(this.clamp(fontSize * 0.72, 10, 15));
    let rowY = inset;

    const drawPill = (text, x, y, options = {}) => {
      const size = options.size || fontSize;
      const pad = options.pad || padX;
      const height = options.height || pillHeight;
      const maxWidth = options.maxWidth || canvas.width - inset * 2;
      const align = options.align || "left";
      ctx.font = `${options.weight || 600} ${Math.round(size)}px Segoe UI`;
      const textWidth = Math.min(ctx.measureText(text).width, maxWidth - pad * 2);
      const width = Math.min(maxWidth, textWidth + pad * 2);
      const drawX = align === "right" ? canvas.width - inset - width : x;

      ctx.fillStyle = options.fill || "rgba(15, 23, 42, 0.72)";
      ctx.fillRect(drawX, y, width, height);
      ctx.fillStyle = options.color || "#f8fafc";
      ctx.textBaseline = "middle";
      ctx.fillText(text, drawX + pad, y + height / 2, width - pad * 2);
      ctx.textBaseline = "alphabetic";
      return { x: drawX, y, width, height };
    };

    drawPill(`Score: ${this.score}   Best: ${this.highScore}`, inset, rowY, {
      weight: 700,
      fill: "rgba(15, 23, 42, 0.76)"
    });
    rowY += pillHeight + rowGap;

    drawPill(`${this.activeCharacter.name} - ${BACKGROUND_NAMES[this.currentThemeKey]}`, inset, rowY, {
      size: smallFontSize,
      fill: "rgba(15, 23, 42, 0.58)",
      color: "#dbeafe"
    });
    rowY += pillHeight + rowGap;

    drawPill(`Stage ${this.clearedPlatforms + 1}   Difficulty ${difficultyTier + 1}`, inset, rowY, {
      size: smallFontSize,
      fill: "rgba(15, 23, 42, 0.58)",
      color: "#cbd5e1"
    });

    if (this.comboMultiplier > 1) {
      const comboText = `Perfect Combo x${this.comboMultiplier}`;
      const comboAlpha =
        this.comboDisplayTimer > 0
          ? Math.min(1, this.comboDisplayTimer / this.config.comboDisplayDuration + 0.2)
          : 1;

      drawPill(comboText, inset, inset + pillHeight + rowGap, {
        align: "right",
        size: smallFontSize,
        fill: `rgba(249, 115, 22, ${0.74 * comboAlpha})`,
        color: `rgba(255, 255, 255, ${comboAlpha})`
      });
    }

    let status = "Hold anywhere to grow";

    if (this.powerUpMessageTimer > 0 && this.powerUpMessage) {
      status = this.powerUpMessage;
    } else if (this.phase === "growing") {
      status = "Release anywhere to drop";
    } else if (this.phase === "rotating") {
      status = "Dropping stick...";
    } else if (this.ghostCorrectionTimer > 0) {
      status = "Ghost correction!";
    } else if (this.phase === "walking") {
      status = "Walking...";
    } else if (this.phase === "landing") {
      if (this.isPerfectLanding) {
        status = "Perfect landing!";
      } else if (this.landingPlatform?.type === "slippery" && this.landingSlideRemaining > 0) {
        status = "Sliding...";
      } else {
        status = "Landing...";
      }
    } else if (this.phase === "shifting") {
      status = "Moving to next platform...";
    } else if (this.phase === "falling") {
      status = "Falling...";
    } else if (this.phase === "ended") {
      status = "Game Over";
    }

    const statusAlign = canvas.width > 680 ? "right" : "left";
    const statusY = statusAlign === "right" ? inset : rowY + pillHeight + rowGap;
    drawPill(status, inset, statusY, {
      align: statusAlign,
      weight: 700,
      fill: "rgba(15, 23, 42, 0.72)",
      color: "#f8fafc"
    });

    if (this.phase === "ready" || this.phase === "growing") {
      const helperText = this.phase === "growing" ? "Release to set the bridge" : "Mouse, touch, or Space";
      drawPill(helperText, inset, statusY + pillHeight + rowGap, {
        align: statusAlign,
        size: smallFontSize,
        height: Math.max(26, pillHeight - 4),
        fill: "rgba(15, 23, 42, 0.46)",
        color: "#bfdbfe"
      });
    }

    if (this.activePowerUp) {
      const powerUpText =
        this.activePowerUp.type === "rescue"
          ? "Power-up: Rescue Save"
          : `Power-up: Boost +${this.config.bonusPowerScore}`;
      drawPill(powerUpText, inset, statusY + (pillHeight + rowGap) * 2, {
        align: statusAlign,
        size: smallFontSize,
        fill: `rgba(${this.activePowerUp.glowColor}, 0.72)`,
        color: "#fff7ed"
      });
    }
  }

  draw() {
    const { ctx } = this;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    ctx.save();
    ctx.translate(this.shakeX, this.shakeY);
    ctx.translate(
      this.canvas.width / 2,
      this.canvas.height / 2 - (1 - this.cameraScale) * 90
    );
    ctx.scale(this.cameraScale, this.cameraScale);
    ctx.translate(-this.canvas.width / 2, -this.canvas.height / 2);

    this.drawBackground();
    [this.currentPlatform, this.targetPlatform, ...this.upcomingPlatforms].forEach((platform) => {
      platform.draw(
        ctx,
        this.perfectFlashPlatform === platform
          ? this.perfectFlashTimer / this.config.perfectFlashDuration
          : 0
      );
    });
    this.drawStickTrail();
    this.stick.draw(ctx, this.phase === "growing");
    this.drawPlayerShadow();
    this.player.draw(ctx);
    this.drawGhostCorrectionEffect();
    this.drawPerfectEffects();
    this.drawHud();
    ctx.restore();
  }

  loop(timestamp) {
    if (!this.lastFrameTime) {
      this.lastFrameTime = timestamp;
    }

    const deltaTime = Math.min((timestamp - this.lastFrameTime) / 1000, 0.032);
    this.lastFrameTime = timestamp;

    this.updateEffects(deltaTime);
    this.update(deltaTime * this.timeScale);
    this.draw();

    requestAnimationFrame((time) => this.loop(time));
  }
}

const canvas = document.getElementById("gameCanvas");
const ui = {
  selectionOverlay: document.getElementById("selectionOverlay"),
  characterGrid: document.getElementById("characterGrid"),
  characterDescription: document.getElementById("characterDescription"),
  startButton: document.getElementById("startButton"),
  gameOverOverlay: document.getElementById("gameOverOverlay"),
  finalScoreLabel: document.getElementById("finalScore"),
  bestScoreLabel: document.getElementById("bestScore"),
  restartButton: document.getElementById("restartButton")
};

new StickHeroGame(canvas, ui);
</script>
</body>
