<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Renderer</title>
    <link rel="icon" href="/games/game_images/gamehublogo.png" type="image/png">
    <link rel="apple-touch-icon" href="/games/game_images/gamehublogo.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .controls {
            background: #333;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        .controls button:hover {
            background: #45a049;
        }
        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            flex: 1;
        }
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 10;
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MSSGVSC9X3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-MSSGVSC9X3');
    </script>
</head>
<body>
    <div class="controls">
        <div>
            <h2 id="game-title">Game Title</h2>
        </div>
        <div>
            <button id="back-button">Back to GameHub</button>
            <button id="refresh-button">Refresh Game</button>
        </div>
    </div>
    
    <div id="game-container">
        <div class="loading" id="loading-screen">Loading game...</div>
        <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
    </div>

    <script>
        // Token validation cache
        let tokenValidationCache = {
            token: null,
            userData: null,
            validUntil: null
        };
        
        // Function to validate token with caching
        async function validateTokenWithCache(token) {
            if (!token) return null;
            
            // Check if we have a valid cached token
            const now = new Date().getTime();
            if (tokenValidationCache.token === token && 
                tokenValidationCache.validUntil !== null && 
                tokenValidationCache.validUntil > now) {
                
                console.log('Using cached token validation, cache valid for', 
                    Math.round((tokenValidationCache.validUntil - now)/1000), 'seconds');
                return tokenValidationCache.userData;
            }
            
            // Need to validate with server
            try {
                console.log('Token not in cache, validating with server...');
                const response = await fetch('/api/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Authentication failed');
                }

                const userData = await response.json();
                
                // Cache the validation result for 5 minutes
                tokenValidationCache = {
                    token: token,
                    userData: userData,
                    validUntil: now + (5 * 60 * 1000) // 5 minutes in milliseconds
                };
                
                return userData;
            } catch (error) {
                console.error('Token validation error:', error);
                tokenValidationCache = { token: null, userData: null, validUntil: null };
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Get game ID from URL
            const params = new URLSearchParams(window.location.search);
            const gameId = params.get('id');
            
            if (!gameId) {
                alert('No game ID provided!');
                window.location.href = '/gamehub';
                return;
            }
            
            // Back button handler
            document.getElementById('back-button').addEventListener('click', function() {
                window.location.href = '/gamehub';
            });
            
            // Refresh button handler
            document.getElementById('refresh-button').addEventListener('click', function() {
                // Show loading screen again
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.style.display = 'flex';
                loadingScreen.textContent = 'Reloading game...';
                
                // Create a fresh iframe to completely reset the game state
                const gameContainer = document.getElementById('game-container');
                const oldIframe = document.getElementById('game-frame');
                
                // Create new iframe with same attributes
                const newIframe = document.createElement('iframe');
                newIframe.id = 'game-frame';
                newIframe.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';
                
                // Replace old iframe with new one
                gameContainer.removeChild(oldIframe);
                gameContainer.appendChild(newIframe);
                
                // Small delay to ensure iframe is ready before loading game
                setTimeout(() => {
                    loadGame(gameId);
                }, 100);
            });
            
            // Load the game
            loadGame(gameId);
            
            async function loadGame(id) {
                console.log('Loading game with ID:', id);
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.style.display = 'flex';
                loadingScreen.textContent = 'Loading game...';
                
                // Check if this is a temporary game from session storage
                if (id === 'temp') {
                    console.log('Detected temporary game, loading from session storage');
                    const gameCode = sessionStorage.getItem('tempGameCode');
                    const gameType = sessionStorage.getItem('tempGameType') || 'code';
                    
                    if (gameCode) {
                        console.log('Found game code in session storage, length:', gameCode.length);
                        // Update game title
                        document.getElementById('game-title').textContent = 'Embedded Game';
                        
                        try {
                            // Get iframe reference
                            const iframe = document.getElementById('game-frame');
                            
                            // Write content to iframe
                            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                            iframeDoc.open();
                            iframeDoc.write(gameCode);
                            iframeDoc.close();
                            
                            // Hide loading screen
                            loadingScreen.style.display = 'none';
                            console.log('Temporary game loaded successfully');
                        } catch (error) {
                            console.error('Error rendering temporary game:', error);
                            loadingScreen.textContent = 'Error loading game: ' + error.message;
                        }
                        
                        return;
                    } else {
                        console.error('No game code found in session storage');
                        alert('No game code found in session storage');
                        window.location.href = '/gamehub';
                        return;
                    }
                }
                
                // Get authentication token
                const token = getToken();
                if (!token) {
                    console.error('No authentication token found');
                    loadingScreen.textContent = 'Error: You must be logged in to play games';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                    return;
                }
                
                try {
                    // Validate token with cache
                    const userData = await validateTokenWithCache(token);
                    if (!userData) {
                        console.error('Token validation failed');
                        loadingScreen.textContent = 'Authentication failed. Please login again.';
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 2000);
                        return;
                    }
                    
                    console.log('User authenticated:', userData.email);
                    console.log('Fetching game data from server...');
                    
                    // Get the game info and content from API
                    const response = await fetch(`/api/games/${id}/play`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.error || 'Failed to load game');
                    }
                    
                    const data = await response.json();
                    
                    console.log('Game data received:', {
                        name: data.name,
                        type: data.gameType,
                        hasContent: !!data.gameCode
                    });
                    
                    // Update game title
                    document.getElementById('game-title').textContent = data.name || 'Game';
                    
                    // Get iframe reference
                    const iframe = document.getElementById('game-frame');
                    
                    // Write content to iframe
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    iframeDoc.open();
                    
                    // If game content is HTML with CSS and JS embedded
                    if (data.gameType === 'code') {
                        console.log('Rendering code-type game, content length:', data.gameCode.length);
                        
                        // Create a new iframe to ensure clean context
                        const gameContainer = document.getElementById('game-container');
                        const oldIframe = document.getElementById('game-frame');
                        
                        // Create new iframe with same attributes
                        const newIframe = document.createElement('iframe');
                        newIframe.id = 'game-frame';
                        newIframe.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';
                        
                        // Replace old iframe with new one
                        gameContainer.removeChild(oldIframe);
                        gameContainer.appendChild(newIframe);
                        
                        // Wait for iframe to be ready
                        setTimeout(() => {
                            // Get new iframe document
                            const newIframeDoc = newIframe.contentDocument || newIframe.contentWindow.document;
                            newIframeDoc.open();
                            newIframeDoc.write(data.gameCode);
                            newIframeDoc.close();
                            
                            // Hide loading screen
                            loadingScreen.style.display = 'none';
                            
                            // Record game play (without await since we're in a timeout)
                            recordGamePlay(id);
                        }, 50);
                    } 
                    // If it's a URL, redirect to it
                    else if (data.gameType === 'url') {
                        console.log('Redirecting to URL:', data.gameCode);
                        window.location.href = data.gameCode;
                        return;
                    }
                    // If it's a file path, load it
                    else if (data.gameType === 'file') {
                        // If we have a direct content URL, use it instead
                        if (data.directContentUrl) {
                            console.log('Using direct content URL:', data.directContentUrl);
                            
                            try {
                                const response = await fetch(data.directContentUrl);
                                console.log('Direct content response status:', response.status);
                                if (!response.ok) {
                                    throw new Error(`Failed to load direct content (${response.status})`);
                                }
                                const content = await response.text();
                                console.log('Direct content received, length:', content.length);
                                
                                // Create a new iframe to ensure clean context
                                const gameContainer = document.getElementById('game-container');
                                const oldIframe = document.getElementById('game-frame');
                                
                                // Create new iframe with same attributes
                                const newIframe = document.createElement('iframe');
                                newIframe.id = 'game-frame';
                                newIframe.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';
                                
                                // Replace old iframe with new one
                                gameContainer.removeChild(oldIframe);
                                gameContainer.appendChild(newIframe);
                                
                                // Wait for iframe to be ready
                                setTimeout(() => {
                                    // Get new iframe document
                                    const newIframeDoc = newIframe.contentDocument || newIframe.contentWindow.document;
                                    newIframeDoc.open();
                                    newIframeDoc.write(content);
                                    newIframeDoc.close();
                                    
                                    // Hide loading screen
                                    loadingScreen.style.display = 'none';
                                    
                                    // Record game play (without await since we're in a timeout)
                                    recordGamePlay(id);
                                }, 50);
                                
                                return;
                            } catch (error) {
                                console.error('Error loading direct content:', error);
                                // Continue to try other loading methods
                            }
                        }
                                    
                        // Load from file path
                        try {
                            console.log('Loading file content from:', data.gamePath || data.gameCode);
                            
                            // Determine the correct path to load - either gamePath or gameCode
                            const filePath = data.gamePath || data.gameCode;
                            
                            // Ensure the path starts with / if it's a relative path
                            const fullPath = filePath.startsWith('/') || filePath.startsWith('http') 
                                ? filePath 
                                : '/' + filePath;
                            
                            console.log('Using full path:', fullPath);
                            
                            // Try to load the file content
                            const response = await fetch(fullPath);
                            console.log('File response status:', response.status);
                            if (!response.ok) {
                                throw new Error(`Failed to load file (${response.status})`);
                            }
                            const content = await response.text();
                            console.log('File content received, length:', content.length);
                            
                            // Create a new iframe to ensure clean context
                            const gameContainer = document.getElementById('game-container');
                            const oldIframe = document.getElementById('game-frame');
                            
                            // Create new iframe with same attributes
                            const newIframe = document.createElement('iframe');
                            newIframe.id = 'game-frame';
                            newIframe.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';
                            
                            // Replace old iframe with new one
                            gameContainer.removeChild(oldIframe);
                            gameContainer.appendChild(newIframe);
                            
                            // Wait for iframe to be ready
                            setTimeout(() => {
                                // Get new iframe document
                                const newIframeDoc = newIframe.contentDocument || newIframe.contentWindow.document;
                                newIframeDoc.open();
                                newIframeDoc.write(content);
                                newIframeDoc.close();
                                
                                // Hide loading screen
                                loadingScreen.style.display = 'none';
                                
                                // Record game play (without await since we're in a timeout)
                                recordGamePlay(id);
                            }, 50);
                        } catch (error) {
                            console.error('Error loading game file:', error);
                            
                            // Fallback to using the gameCode as direct HTML content
                            console.log('Trying to use gameCode as direct content...');
                            if (data.gameCode && data.gameCode.includes('<')) {
                                console.log('Using gameCode as HTML content');
                                
                                // Create a new iframe to ensure clean context
                                const gameContainer = document.getElementById('game-container');
                                const oldIframe = document.getElementById('game-frame');
                                
                                // Create new iframe with same attributes
                                const newIframe = document.createElement('iframe');
                                newIframe.id = 'game-frame';
                                newIframe.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';
                                
                                // Replace old iframe with new one
                                gameContainer.removeChild(oldIframe);
                                gameContainer.appendChild(newIframe);
                                
                                // Wait for iframe to be ready
                                setTimeout(() => {
                                    // Get new iframe document
                                    const newIframeDoc = newIframe.contentDocument || newIframe.contentWindow.document;
                                    newIframeDoc.open();
                                    newIframeDoc.write(data.gameCode);
                                    newIframeDoc.close();
                                    
                                    // Hide loading screen
                                    loadingScreen.style.display = 'none';
                                    
                                    // Record game play
                                    recordGamePlay(id);
                                }, 50);
                            } else {
                                // Create a new iframe to display the error
                                const gameContainer = document.getElementById('game-container');
                                const oldIframe = document.getElementById('game-frame');
                                
                                // Create new iframe with same attributes
                                const newIframe = document.createElement('iframe');
                                newIframe.id = 'game-frame';
                                newIframe.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';
                                
                                // Replace old iframe with new one
                                gameContainer.removeChild(oldIframe);
                                gameContainer.appendChild(newIframe);
                                
                                // Wait for iframe to be ready
                                setTimeout(() => {
                                    // Get new iframe document
                                    const newIframeDoc = newIframe.contentDocument || newIframe.contentWindow.document;
                                    newIframeDoc.open();
                                    newIframeDoc.write(`
                                        <html>
                                        <head>
                                            <style>
                                                body {
                                                    font-family: Arial, sans-serif;
                                                    background: #222;
                                                    color: #fff;
                                                    display: flex;
                                                    flex-direction: column;
                                                    align-items: center;
                                                    justify-content: center;
                                                    height: 100vh;
                                                    margin: 0;
                                                    text-align: center;
                                                }
                                                .error-icon {
                                                    font-size: 64px;
                                                    color: #ff5555;
                                                    margin-bottom: 20px;
                                                }
                                                h1 {
                                                    color: #ff5555;
                                                    margin-bottom: 10px;
                                                }
                                                p {
                                                    margin: 10px 0;
                                                    max-width: 80%;
                                                }
                                            </style>
                                        </head>
                                        <body>
                                            <div class="error-icon">⚠️</div>
                                            <h1>Error Loading Game File</h1>
                                            <p>${error.message}</p>
                                            <p>Path: ${fullPath}</p>
                                            <p>The game file could not be found or accessed.</p>
                                        </body>
                                        </html>
                                    `);
                                    newIframeDoc.close();
                                    loadingScreen.style.display = 'none';
                                }, 50);
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error loading game:', error);
                    // Show error message to user
                    loadingScreen.textContent = `Error: ${error.message}`;
                }
            }
            
            async function recordGamePlay(gameId) {
                console.log('Recording gameplay for ID:', gameId);
                
                const token = getToken();
                if (!token) {
                    console.error('Cannot record gameplay: No token found');
                    return;
                }
                
                try {
                    // Record that user played this game
                    const response = await fetch(`/api/games/${gameId}/play`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ playTime: 0 })
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to record gameplay');
                    }
                    
                    const data = await response.json();
                    console.log('Gameplay recorded successfully');
                } catch (error) {
                    console.error('Error recording gameplay:', error);
                }
            }
            
            function getToken() {
                return localStorage.getItem('gameHubToken') || '';
            }
        });
    </script>
</body>
</html>
